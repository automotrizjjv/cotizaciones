<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b2545">
<title>AUTOMOTRIZ JJV | Sistema de Cotizaciones</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230b2545'/><rect y='50' width='64' height='5' fill='%233aa6dd'/><text x='32' y='40' font-family='Arial,Helvetica,sans-serif' font-size='22' font-weight='900' fill='%23fff' text-anchor='middle'>JJV</text></svg> ">
<style>
/* AUTOMOTRIZ JJV | Sistema de Cotizaciones — Estilos base (blanco, celeste, azul marino) */
:root {
  --marino: #0b2545;
  --marino-2: #13315c;
  --marino-3: #1d4477;
  --celeste: #3aa6dd;
  --celeste-2: #8fd3f5;
  --celeste-claro: #eaf6fd;
  --celeste-medio: #cfe7f6;
  --fondo: #f3f7fb;
  --blanco: #fff;
  --borde: #d9e5ef;
  --texto: #1e293b;
  --gris: #64748b;
  --gris-claro: #94a3b8;
  --error: #b42318;
  --ok: #047857;
  --wa: #1fa855;
  --radio: 12px;
  --sombra: 0 1px 2px rgba(11, 37, 69, 0.06), 0 4px 16px rgba(11, 37, 69, 0.06);
  --fuente: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}
*,
*::before,
*::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--fondo); }
body { margin: 0; font-family: var(--fuente); font-size: 16px; line-height: 1.45; color: var(--texto); background: var(--fondo); }
h1, h2, h3 { color: var(--marino); line-height: 1.2; margin: 0 0 0.5rem; }
h1 { font-size: 1.45rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
a { color: var(--marino-3); }
img { max-width: 100%; }
[hidden] { display: none !important; }
.muted { color: var(--gris); }
.small { font-size: 0.85rem; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pre { white-space: pre-wrap; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem;
  min-height: 46px; padding: 0.6rem 1.1rem; border-radius: 10px; border: 1.5px solid var(--borde);
  background: var(--blanco); color: var(--marino); font: 600 0.95rem var(--fuente); cursor: pointer;
  text-decoration: none; transition: background 0.15s, border-color 0.15s, transform 0.05s; white-space: nowrap;
}
.btn:hover { border-color: var(--celeste); background: var(--celeste-claro); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn-primario { background: var(--marino); border-color: var(--marino); color: #fff; }
.btn-primario:hover { background: var(--marino-2); border-color: var(--marino-2); }
.btn-celeste { background: var(--celeste); border-color: var(--celeste); color: #fff; }
.btn-celeste:hover { background: #2b93c9; border-color: #2b93c9; }
.btn-wa { background: var(--wa); border-color: var(--wa); color: #fff; }
.btn-wa:hover { background: #178d46; border-color: #178d46; }
.btn-texto { border-color: transparent; background: transparent; }
.btn-peligro { color: var(--error); }
.btn-peligro:hover { border-color: var(--error); background: #fff5f4; }
.btn-grande { min-height: 54px; font-size: 1.05rem; padding: 0.8rem 1.4rem; }
.btn-bloque { width: 100%; }
.btn-icono { min-width: 46px; padding: 0.5rem; }
.botonera { display: flex; flex-wrap: wrap; gap: 0.6rem; }

/* ---------- Formularios ---------- */
.campo { display: flex; flex-direction: column; gap: 0.3rem; min-width: 0; }
.campo > label, .etiqueta { font-size: 0.85rem; font-weight: 600; color: var(--marino-2); }
.campo .ayuda { font-size: 0.8rem; color: var(--gris); }
.campo .error-campo { font-size: 0.8rem; color: var(--error); }
input, select, textarea {
  width: 100%; min-height: 46px; padding: 0.6rem 0.8rem; border: 1.5px solid var(--borde); border-radius: 10px;
  background: #fff; color: var(--texto); font: 16px var(--fuente);
}
textarea { min-height: 90px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--celeste); box-shadow: 0 0 0 3px rgba(58, 166, 221, 0.18); }
input.invalido, textarea.invalido, select.invalido { border-color: var(--error); }
input.valido { border-color: var(--ok); }
input[type='checkbox'] { width: 20px; height: 20px; min-height: 0; accent-color: var(--marino); }
.check { display: flex; align-items: center; gap: 0.55rem; font-size: 0.95rem; cursor: pointer; min-height: 40px; }
.rejilla { display: grid; gap: 0.9rem; grid-template-columns: 1fr; }
@media (min-width: 640px) {
  .rejilla-2 { grid-template-columns: repeat(2, 1fr); }
  .rejilla-3 { grid-template-columns: repeat(3, 1fr); }
  .rejilla-4 { grid-template-columns: repeat(4, 1fr); }
  .col-2 { grid-column: span 2; }
}
.alerta { padding: 0.8rem 1rem; border-radius: 10px; font-size: 0.92rem; }
.alerta-error { background: #fdf2f1; color: var(--error); border: 1px solid #f3cdc9; }
.alerta-info { background: var(--celeste-claro); color: var(--marino-2); border: 1px solid var(--celeste-medio); }
.alerta-ok { background: #ecfdf5; color: var(--ok); border: 1px solid #a7f3d0; }

/* ---------- Tarjetas ---------- */
.tarjeta { background: #fff; border: 1px solid var(--borde); border-radius: var(--radio); box-shadow: var(--sombra); padding: 1.1rem; }
.tarjeta + .tarjeta { margin-top: 1rem; }
.tarjeta-titulo { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; margin-bottom: 0.9rem; flex-wrap: wrap; }
.tarjeta-titulo h2 { margin: 0; }

/* ---------- Estados ---------- */
.badge { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.78rem; font-weight: 700; white-space: nowrap; }
.badge::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.estado-pendiente { background: #fef3c7; color: #92400e; }
.estado-enviada { background: #e0f2fe; color: #075985; }
.estado-aprobada { background: #d1fae5; color: #065f46; }
.estado-rechazada { background: #e2e8f0; color: #334155; }
.estado-vencida { background: #ffedd5; color: #9a3412; }
.estado-cotizada { background: #d1fae5; color: #065f46; }
.estado-descartada { background: #e2e8f0; color: #334155; }

/* ---------- Avisos flotantes ---------- */
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: 88px; z-index: 100; display: flex; flex-direction: column; gap: 0.5rem; width: min(92vw, 420px); }
.toast { background: var(--marino); color: #fff; padding: 0.8rem 1rem; border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2); font-size: 0.93rem; animation: entrar 0.2s ease-out; }
.toast-error { background: #7a1d14; }
.toast-ok { background: #0b5d3f; }
@keyframes entrar { from { opacity: 0; transform: translateY(8px); } }
@media (min-width: 960px) { .toasts { bottom: 24px; } }

.cargando { display: grid; place-items: center; padding: 3rem 1rem; color: var(--gris); }
.spinner { width: 28px; height: 28px; border: 3px solid var(--celeste-medio); border-top-color: var(--marino); border-radius: 50%; animation: girar 0.8s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }

/* Panel administrativo — distribución y componentes */
.app { min-height: 100vh; }

/* ---------- Barra lateral (escritorio) / barra superior + inferior (móvil) ---------- */
.lateral { display: none; }
.superior {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 0.6rem;
  background: var(--marino); color: #fff; padding: 0.55rem 0.9rem; padding-top: max(0.55rem, env(safe-area-inset-top));
  border-bottom: 3px solid var(--celeste);
}
.superior .marca { display: flex; align-items: center; gap: 0.55rem; font-weight: 800; letter-spacing: 0.3px; font-size: 1rem; color: #fff; text-decoration: none; }
.marca-logo-mini { height: 32px; width: auto; max-width: 110px; object-fit: contain; background: #fff; border-radius: 6px; padding: 2px 4px; }
.marca-logo-mini.base { background: transparent; padding: 0; border-radius: 0; height: 30px; }
.marca-sello { width: 32px; height: 32px; border-radius: 8px; background: var(--celeste); display: grid; place-items: center; font-weight: 900; font-size: 0.8rem; color: var(--marino); }
.superior .btn { min-height: 38px; color: #fff; background: transparent; border-color: rgba(255, 255, 255, 0.25); padding: 0.4rem 0.7rem; }
.superior .btn:hover { background: rgba(255, 255, 255, 0.1); }

.inferior {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40; display: grid; grid-template-columns: repeat(5, 1fr);
  background: #fff; border-top: 1px solid var(--borde); padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -4px 18px rgba(11, 37, 69, 0.08);
}
.inferior a, .inferior button {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 62px; border: 0; background: none;
  color: var(--gris); font: 600 0.7rem var(--fuente); text-decoration: none; position: relative; cursor: pointer;
}
.inferior svg { width: 23px; height: 23px; }
.inferior .activo { color: var(--marino); }
.inferior .activo::before { content: ''; position: absolute; top: 0; left: 25%; right: 25%; height: 3px; border-radius: 0 0 3px 3px; background: var(--celeste); }
.inferior .nuevo svg { width: 42px; height: 42px; padding: 9px; margin-top: -18px; border-radius: 50%; background: var(--marino); color: #fff; box-shadow: 0 4px 12px rgba(11, 37, 69, 0.3); border: 3px solid #fff; }
.punto { position: absolute; top: 8px; right: calc(50% - 18px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--celeste); color: #fff; font-size: 0.68rem; line-height: 18px; text-align: center; }

.menu-mas { position: fixed; inset: auto 0 calc(62px + env(safe-area-inset-bottom)) 0; z-index: 39; background: #fff; border-top: 1px solid var(--borde); padding: 0.6rem; display: grid; gap: 0.4rem; box-shadow: 0 -8px 24px rgba(11, 37, 69, 0.12); }
.menu-mas a { display: flex; align-items: center; gap: 0.7rem; padding: 0.85rem 1rem; border-radius: 10px; color: var(--marino); font-weight: 600; text-decoration: none; }
.menu-mas a:hover { background: var(--celeste-claro); }
.menu-mas svg { width: 22px; height: 22px; }

.contenido { overflow-x: clip; padding: 1rem 0.85rem 6.5rem; max-width: 1180px; margin: 0 auto; }
.cabecera-vista { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 1rem; }
.cabecera-vista h1 { margin: 0; }
.cabecera-vista p { margin: 0.2rem 0 0; }

@media (min-width: 960px) {
  .app { display: grid; grid-template-columns: 248px 1fr; }
  .superior, .inferior, .menu-mas { display: none !important; }
  .lateral {
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; background: var(--marino); color: #fff; padding: 1.1rem 0.8rem;
    border-right: 4px solid var(--celeste);
  }
  .lateral .marca { display: flex; align-items: center; gap: 0.65rem; color: #fff; text-decoration: none; padding: 0.3rem 0.5rem 1.2rem; font-weight: 800; }
  .lateral .marca small { display: block; font-weight: 500; color: var(--celeste-2); font-size: 0.72rem; letter-spacing: 0.4px; }
  .lateral .marca:has(.marca-logo-mini.base) { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
  .lateral .marca-logo-mini.base { height: 40px; max-width: 160px; }
  .lateral nav { display: flex; flex-direction: column; gap: 0.2rem; }
  .lateral nav a {
    display: flex; align-items: center; gap: 0.7rem; padding: 0.7rem 0.8rem; border-radius: 10px; color: #c9def0; text-decoration: none; font-weight: 600;
    font-size: 0.95rem; position: relative;
  }
  .lateral nav a svg { width: 20px; height: 20px; }
  .lateral nav a:hover { background: rgba(255, 255, 255, 0.07); color: #fff; }
  .lateral nav a.activo { background: var(--celeste); color: var(--marino); }
  .lateral nav .punto { position: static; margin-left: auto; background: #fff; color: var(--marino); }
  .lateral .pie-lateral { margin-top: auto; border-top: 1px solid rgba(255, 255, 255, 0.12); padding-top: 0.8rem; font-size: 0.85rem; color: #c9def0; }
  .lateral .pie-lateral .btn { width: 100%; margin-top: 0.5rem; background: transparent; color: #fff; border-color: rgba(255, 255, 255, 0.25); min-height: 40px; }
  .contenido { padding: 1.6rem 2rem 3rem; }
}

/* ---------- Indicadores ---------- */
.kpis { display: grid; gap: 0.7rem; grid-template-columns: repeat(2, 1fr); margin-bottom: 1rem; }
@media (min-width: 720px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
.kpi { background: #fff; border: 1px solid var(--borde); border-radius: var(--radio); padding: 0.9rem 1rem; box-shadow: var(--sombra); text-decoration: none; color: inherit; display: block; border-top: 4px solid var(--celeste); }
.kpi:hover { border-color: var(--celeste); }
.kpi .valor { font-size: 1.8rem; font-weight: 800; color: var(--marino); line-height: 1.1; }
.kpi .rotulo { font-size: 0.85rem; color: var(--gris); font-weight: 600; }
.kpi.k-pendiente { border-top-color: #f59e0b; }
.kpi.k-enviada { border-top-color: var(--celeste); }
.kpi.k-aprobada { border-top-color: #10b981; }
.kpi.k-rechazada { border-top-color: #94a3b8; }
.resumen-mes { display: grid; gap: 0.7rem; grid-template-columns: 1fr; margin-bottom: 1rem; }
@media (min-width: 720px) { .resumen-mes { grid-template-columns: repeat(3, 1fr); } }
.franja { background: linear-gradient(135deg, var(--marino), var(--marino-3)); color: #fff; border-radius: var(--radio); padding: 1rem 1.1rem; }
.franja .rotulo { color: var(--celeste-2); font-size: 0.82rem; font-weight: 600; }
.franja .valor { font-size: 1.45rem; font-weight: 800; }
.dos-columnas { display: grid; gap: 1rem; }
@media (min-width: 1000px) { .dos-columnas { grid-template-columns: 1fr 1fr; } }

/* ---------- Listas y tablas ---------- */
.buscador { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 0.9rem; }
.buscador .campo-busqueda { flex: 1 1 240px; position: relative; }
.buscador .campo-busqueda svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; color: var(--gris-claro); }
.buscador .campo-busqueda input { padding-left: 2.4rem; }
.buscador select, .buscador input[type='date'] { flex: 0 1 170px; }
.filtros-chips { display: flex; gap: 0.4rem; overflow-x: auto; padding-bottom: 0.3rem; margin-bottom: 0.7rem; -webkit-overflow-scrolling: touch; }
.chip { border: 1.5px solid var(--borde); background: #fff; border-radius: 999px; padding: 0.4rem 0.9rem; font: 600 0.85rem var(--fuente); color: var(--marino-2); cursor: pointer; white-space: nowrap; min-height: 38px; }
.chip.activo { background: var(--marino); border-color: var(--marino); color: #fff; }

.tabla-envoltura { overflow-x: auto; border: 1px solid var(--borde); border-radius: var(--radio); background: #fff; }
table.tabla { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
.tabla th { text-align: left; background: var(--celeste-claro); color: var(--marino); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.4px; padding: 0.7rem 0.8rem; white-space: nowrap; }
.tabla th.ordenable { cursor: pointer; user-select: none; }
.tabla th.ordenable::after { content: ' ↕'; color: var(--gris-claro); }
.tabla td { padding: 0.7rem 0.8rem; border-top: 1px solid var(--borde); vertical-align: middle; }
.tabla tbody tr { cursor: pointer; }
.tabla tbody tr:hover { background: #f8fbfe; }
.tabla .acciones-fila { white-space: nowrap; text-align: right; }
.tabla input.en-linea { min-height: 38px; width: 110px; padding: 0.35rem 0.5rem; text-align: right; }

/* Lista en tarjetas para móvil */
.lista { display: flex; flex-direction: column; gap: 0.6rem; }
.fila-tarjeta { display: block; background: #fff; border: 1px solid var(--borde); border-radius: var(--radio); padding: 0.85rem 0.95rem; text-decoration: none; color: inherit; box-shadow: var(--sombra); }
.fila-tarjeta:hover { border-color: var(--celeste); }
.fila-tarjeta .linea { display: flex; justify-content: space-between; gap: 0.6rem; align-items: center; }
.fila-tarjeta .titulo { font-weight: 700; color: var(--marino); }
.fila-tarjeta .sub { color: var(--gris); font-size: 0.86rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fila-tarjeta .monto { font-weight: 800; color: var(--marino); font-variant-numeric: tabular-nums; }
.solo-escritorio { display: none; }
@media (min-width: 860px) { .solo-escritorio { display: block; } .solo-movil { display: none !important; } }
.vacio { text-align: center; padding: 2.5rem 1rem; color: var(--gris); }
.vacio svg { width: 44px; height: 44px; color: var(--celeste); margin-bottom: 0.4rem; }
.paginacion { display: flex; justify-content: center; align-items: center; gap: 0.8rem; margin-top: 1rem; }
.miniatura { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: var(--celeste-claro); border: 1px solid var(--borde); display: block; }

/* ---------- Formulario de cotización ---------- */
.seccion-form { margin-bottom: 1rem; }
.seccion-form > .tarjeta-titulo .paso { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--celeste); color: #fff; font-weight: 800; font-size: 0.85rem; margin-right: 0.5rem; }
.estado-rut { font-size: 0.82rem; font-weight: 600; }
.estado-rut.ok { color: var(--ok); }
.estado-rut.nuevo { color: var(--marino-3); }
.estado-rut.mal { color: var(--error); }
.item { border: 1.5px solid var(--borde); border-radius: var(--radio); padding: 0.9rem; background: #fbfdff; position: relative; }
.item + .item { margin-top: 0.8rem; }
.item-cabecera { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
.item-numero { font-weight: 800; color: var(--marino); font-size: 0.9rem; }
.item-grid { display: grid; gap: 0.7rem; grid-template-columns: 1fr 1fr; }
.item-grid .ancho { grid-column: 1 / -1; }
@media (min-width: 760px) {
  .item-grid { grid-template-columns: 1.1fr 2.2fr 1.1fr 0.7fr 1.1fr 0.8fr 1.1fr; align-items: end; }
  .item-grid .ancho { grid-column: auto; }
}
.item .subtotal-item { font-weight: 800; color: var(--marino); min-height: 46px; display: flex; align-items: center; justify-content: flex-end; font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.item .info-catalogo { grid-column: 1 / -1; font-size: 0.82rem; color: var(--gris); display: flex; gap: 0.8rem; flex-wrap: wrap; align-items: center; }
.etiqueta-cat { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.15rem 0.5rem; border-radius: 6px; font-weight: 700; font-size: 0.75rem; }
.etiqueta-cat.en { background: #d1fae5; color: #065f46; }
.etiqueta-cat.fuera { background: var(--celeste-claro); color: var(--marino-2); }

.totales-panel { display: grid; gap: 0.45rem; }
.totales-panel .linea { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.totales-panel .linea span:first-child { color: var(--gris); }
.totales-panel .total { margin-top: 0.4rem; padding: 0.85rem 1rem; border-radius: 10px; background: var(--marino); color: #fff; font-size: 1.3rem; font-weight: 800; }
.totales-panel .total span:first-child { color: var(--celeste-2); }
.barra-total {
  position: fixed; left: 0; right: 0; bottom: calc(62px + env(safe-area-inset-bottom)); z-index: 35; display: flex; align-items: center; justify-content: space-between;
  gap: 0.6rem; background: var(--marino); color: #fff; padding: 0.6rem 0.9rem; border-top: 3px solid var(--celeste);
}
.barra-total .monto { font-size: 1.25rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.barra-total .rotulo { font-size: 0.75rem; color: var(--celeste-2); }
.barra-total .btn { min-height: 44px; }
.con-barra-total { padding-bottom: 10rem; }
@media (min-width: 960px) {
  .barra-total { left: 248px; bottom: 0; padding: 0.8rem 2rem; }
  .con-barra-total { padding-bottom: 6rem; }
}

/* ---------- Autocompletado ---------- */
.autocompletar { position: relative; }
.sugerencias {
  position: absolute; z-index: 60; left: 0; right: 0; top: calc(100% + 4px); background: #fff; border: 1px solid var(--borde); border-radius: 10px;
  box-shadow: 0 12px 28px rgba(11, 37, 69, 0.16); max-height: 320px; overflow-y: auto; min-width: 260px;
}
.sugerencia { padding: 0.65rem 0.8rem; cursor: pointer; border-bottom: 1px solid #eef3f8; display: flex; gap: 0.6rem; align-items: center; }
.sugerencia:last-child { border-bottom: 0; }
.sugerencia.activa, .sugerencia:hover { background: var(--celeste-claro); }

<script>
/*
 * AUTOMOTRIZ JJV | Utilidades compartidas entre servidor y navegador.
 * - Validación y formato de RUT chileno
 * - Cálculo de totales de cotización (CLP, descuentos, IVA 19 %)
 * - Formato de moneda, fechas y teléfonos
 * Este archivo se carga con require() en Node y con <script> en el navegador.
 */
(function (raiz, fabrica) {
  if (typeof module === 'object' && module.exports) module.exports = fabrica();
  else raiz.JJV = fabrica();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const TASA_IVA = 0.19;

  /* ------------------------------ RUT ------------------------------ */

  /** Deja solo dígitos y K, en mayúsculas. */
  function limpiarRut(rut) {
    return String(rut || '').replace(/[^0-9kK]/g, '').toUpperCase();
  }

  /** Calcula el dígito verificador (módulo 11) del cuerpo numérico. */
  function calcularDv(cuerpo) {
    let suma = 0;
    let multiplo = 2;
    for (let i = cuerpo.length - 1; i >= 0; i--) {
      suma += Number(cuerpo[i]) * multiplo;
      multiplo = multiplo === 7 ? 2 : multiplo + 1;
    }
    const resto = 11 - (suma % 11);
    if (resto === 11) return '0';
    if (resto === 10) return 'K';
    return String(resto);
  }

  /** true si el RUT es válido (acepta con o sin puntos y guion). */
  function validarRut(rut) {
    const limpio = limpiarRut(rut);
    if (limpio.length < 2 || limpio.length > 9) return false;
    const cuerpo = limpio.slice(0, -1);
    const dv = limpio.slice(-1);
    if (!/^\d+$/.test(cuerpo)) return false;
    if (Number(cuerpo) < 100000) return false;
    return calcularDv(cuerpo) === dv;
  }

  /** Formato de almacenamiento: 12345678-K (sin puntos). */
  function normalizarRut(rut) {
    const limpio = limpiarRut(rut);
    if (limpio.length < 2) return '';
    return limpio.slice(0, -1).replace(/^0+/, '') + '-' + limpio.slice(-1);
  }

  /** Formato de visualización: 12.345.678-K */
  function formatearRut(rut) {
    const limpio = limpiarRut(rut);
    if (limpio.length < 2) return limpio;
    const cuerpo = limpio.slice(0, -1).replace(/^0+/, '');
    const dv = limpio.slice(-1);
    return cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '-' + dv;
  }

  /* --------------------------- Cálculos --------------------------- */

  /** Monto en CLP (entero). Acepta números o texto como "25.990" o "$ 25.990". */
  function entero(valor) {
    if (typeof valor === 'number') return Number.isFinite(valor) ? Math.round(valor) : 0;
    // Número con punto decimal (ej. "219990.54" desde Excel): el punto con 3 dígitos se trata como miles
    if (/^\s*-?\d+\.(\d{1,2}|\d{4,})\s*$/.test(String(valor))) return Math.round(Number(valor));
    const s = String(valor ?? '').replace(/,\d{1,2}$/, '').replace(/[^\d-]/g, '');
    const n = Number(s);
    return s && Number.isFinite(n) ? n : 0;
  }

  function porcentaje(valor) {
    const n = Number(String(valor ?? '').replace(',', '.'));
    if (!Number.isFinite(n) || n < 0) return 0;
    return Math.min(n, 100);
  }

  /**
   * Calcula los totales de una cotización en pesos chilenos (enteros).
   *
   * opciones.preciosConIva = true  → los precios ingresados YA incluyen IVA:
   *     el total es la suma; el IVA se desglosa (no se vuelve a sumar).
   * opciones.preciosConIva = false → los precios son netos: se suma 19 %.
   * opciones.aplicaIva = false     → no se calcula IVA (documento sin impuesto).
   */
  function calcularCotizacion(items, opciones) {
    const op = Object.assign({ preciosConIva: true, aplicaIva: true, descuentoGlobalPct: 0 }, opciones || {});
    const lineas = (items || []).map(function (item) {
      const cantidad = Math.max(0, Number(String(item.cantidad ?? 0).replace(',', '.')) || 0);
      const precioUnitario = Math.max(0, entero(item.precio_unitario ?? item.precioUnitario));
      const descuentoPct = porcentaje(item.descuento_pct ?? item.descuentoPct);
      const bruto = Math.round(cantidad * precioUnitario);
      const descuento = Math.round((bruto * descuentoPct) / 100);
      return {
        cantidad: cantidad,
        precio_unitario: precioUnitario,
        descuento_pct: descuentoPct,
        bruto: bruto,
        descuento: descuento,
        subtotal: bruto - descuento,
      };
    });

    const sumaBruta = lineas.reduce((a, l) => a + l.bruto, 0);
    const descuentoLineas = lineas.reduce((a, l) => a + l.descuento, 0);
    const sumaSubtotales = sumaBruta - descuentoLineas;
    const descuentoGlobalPct = porcentaje(op.descuentoGlobalPct);
    const descuentoGlobal = Math.round((sumaSubtotales * descuentoGlobalPct) / 100);
    const base = sumaSubtotales - descuentoGlobal;

    let neto;
    let iva;
    let total;
    if (!op.aplicaIva) {
      neto = base;
      iva = 0;
      total = base;
    } else if (op.preciosConIva) {
      total = base;
      neto = Math.round(total / (1 + TASA_IVA));
      iva = total - neto;
    } else {
      neto = base;
      iva = Math.round(neto * TASA_IVA);
      total = neto + iva;
    }

    return {
      lineas: lineas,
      sumaBruta: sumaBruta,
      descuentoLineas: descuentoLineas,
      descuentoGlobalPct: descuentoGlobalPct,
      descuentoGlobal: descuentoGlobal,
      descuentoTotal: descuentoLineas + descuentoGlobal,
      sumaSubtotales: sumaSubtotales,
      neto: neto,
      iva: iva,
      total: total,
      preciosConIva: !!op.preciosConIva,
      aplicaIva: !!op.aplicaIva,
    };
  }

  /* ---------------------------- Formatos ---------------------------- */

  function clp(valor) {
    const n = Math.round(Number(valor) || 0);
    const signo = n < 0 ? '-' : '';
    return signo + '$' + String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  /** 2026-11-23 → 23-11-2026 */
  function fechaCl(iso) {
    if (!iso) return '';
    const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[3] + '-' + m[2] + '-' + m[1] : String(iso);
  }

  /** Normaliza un teléfono chileno al formato internacional sin "+" (56912345678). */
  function telefonoWhatsapp(telefono) {
    let d = String(telefono || '').replace(/\D/g, '');
    if (!d) return '';
    if (d.startsWith('00')) d = d.slice(2);
    if (d.length === 9 && d.startsWith('9')) return '56' + d;
    if (d.length === 8) return '569' + d;
    if (d.length === 9 && /^[2-8]/.test(d)) return '56' + d;
    return d;
  }

  function validarTelefono(telefono) {
    const d = String(telefono || '').replace(/\D/g, '');
    return d.length >= 8 && d.length <= 15;
  }

  function validarEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(email || '').trim());
  }

  return {
    TASA_IVA: TASA_IVA,
    limpiarRut: limpiarRut,
    calcularDv: calcularDv,
    validarRut: validarRut,
    normalizarRut: normalizarRut,
    formatearRut: formatearRut,
    calcularCotizacion: calcularCotizacion,
    entero: entero,
    porcentaje: porcentaje,
    clp: clp,
    fechaCl: fechaCl,
    telefonoWhatsapp: telefonoWhatsapp,
    validarTelefono: validarTelefono,
    validarEmail: validarEmail,
  };
});

</script>

  async function vaciarLotes() {

  function escribir(coleccion, id) {
    if (coleccion === 'productos') {
      marcarLote(id);
      return Promise.resolve();

    const clave = coleccion + '/' + id;

            if (/not_allowed|disabled|no_autorizado|database error/i.test(m)) return mostrar('La clave del equipo ya fue creada. Use «Volver a ingresar».');

  /** Lee todos los documentos (o solo los cambiados desde una fecha), de a 1000 filas. */
  Nube.leer = async function (desde) {
    const todas = [];
    for (let i = 0; ; i += 1000) {
      let q = Nube.cliente.from('documentos').select('coleccion,id,datos,borrado,actualizado').order('actualizado', { ascending: true }).range(i, i + 999);
      q = desde ? q.gt('actualizado', desde) : q.eq('borrado', false);
      const { data, error } = await q;
      if (error) throw error;
      todas.push(...data);
      if (data.length < 1000) break;
    }
    for (const f of todas) if (!Nube.desde || f.actualizado > Nube.desde) Nube.desde = f.actualizado;
    return todas;
  };

  async function subir(coleccion, id, datos) {
    const fila = datos ? { coleccion, id, datos, borrado: false } : { coleccion, id, datos: null, borrado: true };
    const { error } = await Nube.cliente.from('documentos').upsert(fila, { onConflict: 'coleccion,id' });
    if (error) throw error;
  }
  const firmaDe = (m) => {
    const { contadores, ...resto } = m || {};
    return JSON.stringify(resto);
  };
  /** Objeto con la misma forma que la base de datos de Claude, para reutilizar la carga y el guardado. */
  Nube.raiz = function () {
    const docs = (c) => Nube.filas.filter((f) => f.coleccion === c).map((f) => ({ id: f.id, data: () => f.datos }));
    const conReintento = (c, id, fn) => async (...a) => {
      try {
        await fn(...a);
        Nube.pendientes.delete(c + '/' + id);
      } catch (e) {
        Nube.pendientes.set(c + '/' + id, () => fn(...a));
        if (window.App && !Nube.avisado) {
          Nube.avisado = true;
          App.toast('Sin conexión: los cambios se subirán cuando vuelva internet.', 'error');
        }
        throw e;
      }
    };
    return {
      get: async () => {
        const f = Nube.filas.find((x) => x.coleccion === 'meta' && x.id === 'meta');
        if (f) Nube.firmaMeta = firmaDe(f.datos);
        return { exists: !!f, data: () => (f ? f.datos : {}) };
      },
      set: async (datos) => {
        const firma = firmaDe(datos);
        if (firma === Nube.firmaMeta) return;
        const { contadores, ...resto } = datos;
        await conReintento('meta', 'meta', () => subir('meta', 'meta', resto))();
        Nube.firmaMeta = firma;
      },
      collection: (c) => ({
        get: async () => ({ docs: docs(c) }),
        doc: (id) => ({
          set: conReintento(c, id, (datos) => subir(c, String(id), datos)),
          delete: conReintento(c, id, () => subir(c, String(id), null)),
        }),
      }),
    };
  };

    const fin = Number(data);
    const r = (Nube.reservas[nombre] = Nube.reservas[nombre] || []);

  /* ---- Logo JJV por defecto: se toma de la tienda y se guarda en este navegador ---- */
  const LOGO_BASE_URL = 'https://www.automotrizjjv.com/cdn/shop/files/ChatGPT_Image_2_may_2026_12_37_18.png?width=800';

  // Quita el fondo oscuro del logo y lo recorta al contenido (queda PNG transparente).
  async function prepararLogoBase(blob) {
    const url = URL.createObjectURL(blob);
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      const w = img.naturalWidth, h = img.naturalHeight;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const x = c.getContext('2d');
      x.drawImage(img, 0, 0);
      const d = x.getImageData(0, 0, w, h);
      const px = d.data;
      let x0 = w, y0 = h, x1 = -1, y1 = -1;
      for (let i = 0; i < px.length; i += 4) {
        const m = Math.max(px[i], px[i + 1], px[i + 2]);
        const a = Math.max(0, Math.min(255, Math.round(((m - 35) * 255) / 60)));
        px[i + 3] = a;
        if (a > 60) {
          const k = i / 4, cx = k % w, cy = (k / w) | 0;
          if (cx < x0) x0 = cx; if (cx > x1) x1 = cx; if (cy < y0) y0 = cy; if (cy > y1) y1 = cy;
        }
      }
      if (x1 < 0) return '';
      x.putImageData(d, 0, 0);
      const pad = Math.round((y1 - y0) * 0.08);
      x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(h - 1, y1 + pad);
      const o = document.createElement('canvas');
      o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
      o.getContext('2d').drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
      return o.toDataURL('image/png');
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  /** Reduce una imagen y la guarda como data URL (JPEG o PNG). */
  async function guardarImagen(archivo, { max = 800, png = false } = {}) {
    if (!archivo || !archivo.size) return null;
    if (!/^image\/(jpeg|png|webp)$/.test(archivo.type)) fallo(400, 'Formato de imagen no permitido. Use JPG, PNG o WEBP.');
    const url = URL.createObjectURL(archivo);
    try {
      const img = await new Promise((ok, mal) => {
        const i = new Image();
        i.onload = () => ok(i);
        i.onerror = () => mal(new Err(400, 'El archivo no es una imagen válida.'));
        i.src = url;
      });
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      const ctx = c.getContext('2d');
      if (!png) {
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, c.width, c.height);
      }
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const datos = png ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.72);
      const clave = Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, '0')).join('') + (png ? '.png' : '.jpg');
      E.fotos.set(clave, { id: clave, datos });
      await escribir('fotos', clave);
      return clave;
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  function normalizarEntrada(b) {

    if (!cliente.telefono && !cliente.whatsapp) err.push('Ingrese un teléfono o WhatsApp del cliente.');

      .map((it) => ({
        producto_id: it.producto_id ? Number(it.producto_id) : null,
        sku: txt(it.sku, 60), nombre: txt(it.nombre, 250), oem: txt(it.oem, 80),
        cantidad: Number(String(it.cantidad ?? '').replace(',', '.')),

        guardar_en_catalogo: bool(it.guardar_en_catalogo),
      }))
      .filter((it) => it.nombre || it.sku || it.precio_unitario);
    if (!items.length) err.push('Agregue al menos un repuesto.');
    items.forEach((it, i) => {

    if (!(vig >= 1 && vig <= 365)) err.push('La vigencia debe estar entre 1 y 365 días.');

  function parsearCsv(texto) {
    texto = texto.replace(/^﻿/, '');
    const pri = texto.split(/\r?\n/)[0] || '';
    const sep = (pri.match(/;/g) || []).length >= (pri.match(/,/g) || []).length ? ';' : ',';
    const filas = [];
    let fila = [], campo = '', com = false;
    for (let i = 0; i < texto.length; i++) {
      const ch = texto[i];
      if (com) {
        if (ch === '"' && texto[i + 1] === '"') (campo += '"'), i++;
        else if (ch === '"') com = false;
        else campo += ch;
      } else if (ch === '"') com = true;
      else if (ch === sep) fila.push(campo), (campo = '');
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && texto[i + 1] === '\n') i++;
        fila.push(campo), filas.push(fila), (fila = []), (campo = '');
      } else campo += ch;
    }
    if (campo || fila.length) fila.push(campo), filas.push(fila);
    return filas.filter((f) => f.some((c) => c.trim() !== ''));
  }

  /** Crea o actualiza productos por SKU. Solo cambia los campos que vienen con datos. */
  function importarProductos(registros) {
    const porSku = new Map(lista('productos').map((p) => [String(p.sku).toLowerCase(), p]));
    let creados = 0, actualizados = 0;
    const errores = [];
    registros.forEach((o, i) => {
      const sku = txt(o.sku, 60);
      if (!sku) return errores.push(`Fila ${o._fila || i + 2}: sin SKU.`);
      const v = {};
      for (const c of ['nombre', 'oem', 'marca', 'modelo', 'anio', 'precio', 'stock', 'descripcion', 'observaciones']) {
        const val = o[c];
        if (val === undefined || val === null || String(val).trim() === '') continue;
        v[c] = c === 'precio' ? U.entero(val) : c === 'stock' ? parseInt(String(val).replace(/\./g, '').replace(',', '.'), 10) || 0 : String(val).trim().slice(0, 4000);
      }
      const ex = porSku.get(sku.toLowerCase());
      if (ex) {
        if (!Object.keys(v).length) return;
        Object.assign(ex, v, { actualizado: ahora() });
        guardar('productos', ex);
        actualizados++;
      } else {
        if (!v.nombre) return errores.push(`Fila ${o._fila || i + 2}: SKU nuevo sin nombre.`);
        const n = { id: sig('productos'), sku, nombre: '', oem: null, marca: null, modelo: null, anio: null, precio: 0, stock: null, foto: null, descripcion: null, observaciones: null, ...v, creado: ahora(), actualizado: ahora() };
        guardar('productos', n);
        porSku.set(sku.toLowerCase(), n);
        creados++;
      }
    });
    guardarMeta();
    return { creados, actualizados, errores: errores.slice(0, 50) };

  const SHEETJS = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  let cargaSheetjs = null;
  async function leerExcel(archivo) {
    if (!window.XLSX) {
      cargaSheetjs =
        cargaSheetjs ||
        new Promise((ok, mal) => {
          const s = document.createElement('script');
          s.src = SHEETJS;
          s.onload = ok;
          s.onerror = () => {
            cargaSheetjs = null;
            mal(new Err(400, 'No se pudo cargar el lector de Excel. Revise su conexión.'));
          };
          document.head.appendChild(s);
        });
      await cargaSheetjs;
    }
    const libro = window.XLSX.read(await archivo.arrayBuffer(), { type: 'array' });
    const hoja = libro.Sheets[libro.SheetNames[0]];
    return window.XLSX.utils.sheet_to_json(hoja, { header: 1, raw: true, defval: '' }).map((f) => f.map((c) => (c == null ? '' : String(c))));
  }

  /* ---- Productos ---- */
  function buscarProductos(t, lim) {
    const s = t.toLowerCase();
    const rango = (p) => (nocase(p.sku, t) === 0 ? 0 : String(p.sku).toLowerCase().startsWith(s) ? 1 : String(p.nombre).toLowerCase().startsWith(s) ? 2 : 3);
    // Cada palabra puede aparecer en cualquier parte (sin importar tildes ni orden)
    const sinTilde = (v) => String(v || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    const palabras = sinTilde(t).split(/\s+/).filter(Boolean);
    return lista('productos')
      .filter((p) => {
        const texto = sinTilde([p.sku, p.nombre, p.oem, p.marca, p.modelo, p.anio].join(' '));
        return palabras.every((w) => texto.includes(w));
      })
      .sort((a, b) => rango(a) - rango(b) || nocase(a.nombre, b.nombre))
      .slice(0, lim);
  }
  ruta('GET', '/api/admin/productos', (p, q) => {

  ruta('GET', '/api/admin/productos/sku/:sku', ([sku]) => lista('productos').find((p) => nocase(p.sku, decodeURIComponent(sku)) === 0) || fallo(404, 'SKU no registrado.'));
  function datosProducto(b) {
    const d = {
      sku: txt(b.sku, 60), nombre: txt(b.nombre, 250), oem: txt(b.oem, 80) || null, marca: txt(b.marca, 60) || null,
      modelo: txt(b.modelo, 80) || null, anio: txt(b.anio, 30) || null, precio: U.entero(b.precio),
      stock: b.stock === '' || b.stock == null ? null : parseInt(b.stock, 10),

    };
    const err = [];
    if (!d.sku) err.push('El SKU es obligatorio.');
    if (!d.nombre) err.push('El nombre del repuesto es obligatorio.');
    if (d.stock != null && !Number.isFinite(d.stock)) err.push('El stock debe ser un número entero.');
    if (err.length) fallo(400, err.join(' '));
    return d;
  }

  ruta('POST', '/api/admin/productos/ajuste-precios', (p, q, b) => {
    const pct = Number(String(b.porcentaje ?? '').replace(',', '.'));
    if (!Number.isFinite(pct) || pct <= -90 || pct > 500 || pct === 0) fallo(400, 'Porcentaje no válido.');
    const red = [1, 10, 100, 1000].includes(Number(b.redondeo)) ? Number(b.redondeo) : 1;
    const marca = txt(b.marca, 60);
    const filas = lista('productos').filter((x) => !marca || nocase(x.marca, marca) === 0);
    filas.forEach((x) => {
      x.precio = Math.round((x.precio * (1 + pct / 100)) / red) * red;

      guardar('productos', x);

    const norm = (s) => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
    let cab = filas[0].map(norm);
    if (cab.includes('precio final')) {
      // Exportación de productos de Contabilium: precio final con IVA, sin stock
      const usar = { sku: 'sku', nombre: 'nombre', 'codigo oem': 'oem', 'precio final': 'precio', descripcion: 'descripcion', observaciones: 'observaciones' };
      cab = cab.map((c) => usar[c] || '_');
    } else {
      const alias = { ano: 'anio', 'codigo oem': 'oem', 'precio venta': 'precio', 'nombre repuesto': 'nombre' };
      cab = cab.map((c) => alias[c] || c);
    }
    if (!cab.includes('sku')) fallo(400, 'Falta la columna "SKU" en la primera fila.');
    const registros = filas.slice(1).map((f, i) => {
      const o = { _fila: i + 2 };
