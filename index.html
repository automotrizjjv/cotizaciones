<script>
/* PDF corporativo (misma lógica que src/pdf.js, adaptada al navegador) */
(function () {
'use strict';
const U = window.JJV;
const C = {
  marino: '#0B2545',
  marinoSuave: '#13315C',
  celeste: '#3AA6DD',
  celesteClaro: '#EAF6FD',
  celesteBorde: '#CFE7F6',
  texto: '#1E293B',
  gris: '#64748B',
  blanco: '#FFFFFF',
};

const ANCHO = 595.28;
const ALTO = 841.89;
const M = 40;
const UTIL = ANCHO - M * 2;
const LIMITE_INF = ALTO - 70;

function rutaLogo() {
  return (window.Demo && window.Demo.logo()) || null;
}

function cantidadTxt(n) {
  const v = Number(n);
  return v % 1 === 0 ? String(v) : v.toLocaleString('es-CL', { maximumFractionDigits: 2 });
}

function generarPdf(cot, cfg) {
  return new Promise((resolve, reject) => {
    const doc = new window.PDFDocument({
      size: 'A4',
      margins: { top: M, bottom: M, left: M, right: M },
      bufferPages: true,
      info: {
        Title: `Cotización ${cot.numero} - ${cfg.empresa_nombre || 'AUTOMOTRIZ JJV'}`,
        Author: cfg.empresa_nombre || 'AUTOMOTRIZ JJV',
        Subject: 'Cotización de repuestos',
      },
    });
    const partes = [];
    doc.on('data', (b) => partes.push(b));
    doc.on('end', () => resolve(new Blob(partes, { type: 'application/pdf' })));
    doc.on('error', reject);

    const empresa = cfg.empresa_nombre || 'AUTOMOTRIZ JJV';

    /* ---------------- Encabezado ---------------- */
    doc.rect(0, 0, ANCHO, 112).fill(C.marino);
    doc.rect(0, 112, ANCHO, 4).fill(C.celeste);

    const logo = rutaLogo(cfg);
    let logoOk = false;
    if (logo) {
      try {
        if (!(window.Demo && window.Demo.logoEsBase && window.Demo.logoEsBase())) doc.roundedRect(M, 20, 150, 72, 8).fill(C.blanco);
        doc.image(logo, M + 8, 26, { fit: [134, 60], align: 'center', valign: 'center' });
        logoOk = true;
      } catch (e) {
        logoOk = false;
      }
    }
    if (!logoOk) {
      doc.fillColor(C.blanco).font('Helvetica-Bold').fontSize(22).text(empresa, M, 36, { width: 260 });
      if (cfg.empresa_giro) {
        doc.fillColor('#BFE3F7').font('Helvetica').fontSize(9.5).text(cfg.empresa_giro, M, doc.y + 2, { width: 260 });
      }
    }

    doc.fillColor(C.blanco).font('Helvetica-Bold').fontSize(24).text('COTIZACIÓN', 300, 26, { width: UTIL - 260, align: 'right' });
    doc.fillColor('#8FD3F5').font('Helvetica-Bold').fontSize(12.5).text(`N° ${cot.numero}`, 300, 56, { width: UTIL - 260, align: 'right' });
    doc
      .fillColor(C.blanco)
      .font('Helvetica')
      .fontSize(9.5)
      .text(`Fecha de emisión: ${U.fechaCl(cot.fecha)}`, 300, cot.vendedor ? 73 : 76, { width: UTIL - 260, align: 'right' })
      .text(`Válida hasta: ${U.fechaCl(cot.vence)}`, 300, cot.vendedor ? 85 : 89, { width: UTIL - 260, align: 'right' });
    if (cot.vendedor) doc.text(`Vendedor: ${cot.vendedor}`, 300, 97, { width: UTIL - 260, align: 'right', height: 12, ellipsis: true, lineBreak: false });

    /* ---------------- Datos de la empresa ---------------- */
    let y = 128;
    const datosEmpresa = [
      cfg.empresa_rut ? `RUT ${U.formatearRut(cfg.empresa_rut)}` : '',
      cfg.empresa_direccion,
      cfg.empresa_telefono ? `Tel. ${cfg.empresa_telefono}` : '',
      cfg.empresa_whatsapp ? `WhatsApp ${cfg.empresa_whatsapp}` : '',
      cfg.empresa_email,
      cfg.empresa_web,
    ].filter(Boolean);
    doc.fillColor(C.marino).font('Helvetica-Bold').fontSize(11).text(empresa, M, y);
    if (datosEmpresa.length) {
      doc.fillColor(C.gris).font('Helvetica').fontSize(8.5).text(datosEmpresa.join('   ·   '), M, doc.y + 2, { width: UTIL });
    }
    y = doc.y + 12;

    /* ---------------- Cliente y vehículo ---------------- */
    const anchoCaja = (UTIL - 12) / 2;
    const filasCliente = [
      ['Cliente', cot.cliente_nombre],
      ['RUT', cot.cliente_rut ? U.formatearRut(cot.cliente_rut) : '—'],
      ['Teléfono', cot.cliente_telefono || '—'],
      ['Correo', cot.cliente_email || '—'],
    ];
    const filasVehiculo = [
      ['Marca', cot.vehiculo_marca || '—'],
      ['Modelo', cot.vehiculo_modelo || '—'],
      ['Año', cot.vehiculo_anio || '—'],
    ];
    const altoCaja = 26 + filasCliente.length * 15;
    const caja = (x, titulo, filas) => {
      doc.roundedRect(x, y, anchoCaja, altoCaja, 6).fill(C.celesteClaro);
      doc.rect(x, y, 4, altoCaja).fill(C.celeste);
      doc.fillColor(C.celeste).font('Helvetica-Bold').fontSize(8.5).text(titulo, x + 14, y + 9, { characterSpacing: 1 });
      let yy = y + 24;
      for (const [k, v] of filas) {
        doc.fillColor(C.gris).font('Helvetica').fontSize(8.5).text(k, x + 14, yy, { width: 60 });
        doc
          .fillColor(C.texto)
          .font('Helvetica-Bold')
          .fontSize(9)
          .text(String(v), x + 74, yy, { width: anchoCaja - 86, height: 13, ellipsis: true, lineBreak: false });
        yy += 15;
      }
    };
    caja(M, 'DATOS DEL CLIENTE', filasCliente);
    caja(M + anchoCaja + 12, 'VEHÍCULO', filasVehiculo);
    y += altoCaja + 18;

    /* ---------------- Tabla de repuestos ---------------- */
    const cols = [
      { t: '#', w: 22, a: 'center' },
      { t: 'SKU', w: 78, a: 'left' },
      { t: 'Descripción', w: 185, a: 'left' },
      { t: 'Cant.', w: 38, a: 'center' },
      { t: 'P. unitario', w: 70, a: 'right' },
      { t: 'Desc.', w: 44, a: 'right' },
      { t: 'Subtotal', w: 78, a: 'right' },
    ];
    const encabezadoTabla = () => {
      doc.roundedRect(M, y, UTIL, 24, 4).fill(C.marino);
      let x = M;
      doc.fillColor(C.blanco).font('Helvetica-Bold').fontSize(8.5);
      for (const c of cols) {
        doc.text(c.t, x + 5, y + 8, { width: c.w - 10, align: c.a });
        x += c.w;
      }
      y += 24;
    };
    encabezadoTabla();

    cot.items.forEach((it, i) => {
      doc.font('Helvetica-Bold').fontSize(9);
      const hNombre = doc.heightOfString(it.nombre, { width: cols[2].w - 10 });
      const hOem = it.oem ? 11 : 0;
      const alto = Math.max(24, hNombre + hOem + 12);
      if (y + alto > LIMITE_INF) {
        doc.addPage();
        y = M;
        encabezadoTabla();
      }
      if (i % 2 === 1) doc.rect(M, y, UTIL, alto).fill(C.celesteClaro);
      doc.moveTo(M, y + alto).lineTo(M + UTIL, y + alto).lineWidth(0.5).strokeColor(C.celesteBorde).stroke();
      const valores = [
        String(i + 1),
        it.sku || '—',
        null,
        cantidadTxt(it.cantidad),
        U.clp(it.precio_unitario),
        it.descuento_pct ? `${Number(it.descuento_pct).toLocaleString('es-CL')} %` : '—',
        U.clp(it.subtotal),
      ];
      let x = M;
      cols.forEach((c, k) => {
        if (k === 2) {
          doc.fillColor(C.texto).font('Helvetica-Bold').fontSize(9).text(it.nombre, x + 5, y + 7, { width: c.w - 10 });
          if (it.oem) doc.fillColor(C.gris).font('Helvetica').fontSize(7.5).text(`OEM: ${it.oem}`, x + 5, doc.y + 1, { width: c.w - 10 });
        } else {
          doc
            .fillColor(k === 6 ? C.marino : C.texto)
            .font(k === 6 ? 'Helvetica-Bold' : 'Helvetica')
            .fontSize(k === 1 ? 8 : 9)
            .text(valores[k], x + 5, y + 7, { width: c.w - 10, align: c.a });
        }
        x += c.w;
      });
      y += alto;
    });

    /* ---------------- Totales ---------------- */
    const filasTot = [['Subtotal', U.clp(cot.suma_bruta)]];
    if (cot.descuento_total > 0) {
      const etiqueta = cot.descuento_global_pct ? `Descuentos (incl. ${Number(cot.descuento_global_pct).toLocaleString('es-CL')} % global)` : 'Descuentos';
      filasTot.push([etiqueta, '-' + U.clp(cot.descuento_total)]);
    }
    if (cot.aplica_iva) {
      filasTot.push(['Neto', U.clp(cot.neto)]);
      filasTot.push(['IVA (19 %)', U.clp(cot.iva)]);
    }
    const altoTotales = filasTot.length * 17 + 46;
    if (y + 16 + altoTotales > LIMITE_INF) {
      doc.addPage();
      y = M;
    }
    y += 16;
    const xT = M + UTIL - 250;
    let yT = y;
    for (const [k, v] of filasTot) {
      doc.fillColor(C.gris).font('Helvetica').fontSize(9.5).text(k, xT, yT, { width: 150 });
      doc.fillColor(C.texto).font('Helvetica-Bold').fontSize(9.5).text(v, xT + 150, yT, { width: 100, align: 'right' });
      yT += 17;
    }
    doc.roundedRect(xT - 10, yT + 2, 260, 34, 6).fill(C.marino);
    doc.fillColor(C.blanco).font('Helvetica-Bold').fontSize(12).text('TOTAL', xT, yT + 13);
    doc.fillColor(C.blanco).font('Helvetica-Bold').fontSize(16).text(U.clp(cot.total), xT + 80, yT + 10, { width: 160, align: 'right' });
    const notaIva = !cot.aplica_iva ? 'Valores sin IVA.' : cot.precios_con_iva ? 'Precios con IVA incluido.' : 'Precios netos + IVA 19 %.';
    doc.fillColor(C.gris).font('Helvetica-Oblique').fontSize(8).text(notaIva, xT, yT + 41, { width: 250, align: 'right' });

    // Caja de vigencia a la izquierda de los totales
    const anchoVig = UTIL - 270;
    doc.roundedRect(M, y, anchoVig, 62, 6).lineWidth(1).strokeColor(C.celesteBorde).stroke();
    doc.fillColor(C.celeste).font('Helvetica-Bold').fontSize(8.5).text('VIGENCIA', M + 12, y + 10, { characterSpacing: 1 });
    doc
      .fillColor(C.texto)
      .font('Helvetica')
      .fontSize(9)
      .text(
        `Esta cotización es válida por ${cot.vigencia_dias} ${cot.vigencia_dias === 1 ? 'día' : 'días'}, hasta el ${U.fechaCl(cot.vence)}.`,
        M + 12,
        y + 24,
        { width: anchoVig - 24 }
      );

    y = Math.max(yT + 58, y + 74);

    /* ---------------- Condiciones y observaciones ---------------- */
    const seccion = (titulo, texto) => {
      if (!texto) return;
      doc.font('Helvetica').fontSize(9);
      const h = doc.heightOfString(texto, { width: UTIL });
      if (y + Math.min(h, 120) + 24 > LIMITE_INF) {
        doc.addPage();
        y = M;
      }
      doc.fillColor(C.marino).font('Helvetica-Bold').fontSize(10).text(titulo, M, y);
      doc.moveTo(M, doc.y + 3).lineTo(M + 60, doc.y + 3).lineWidth(2).strokeColor(C.celeste).stroke();
      doc.fillColor(C.texto).font('Helvetica').fontSize(9).text(texto, M, doc.y + 9, { width: UTIL, lineGap: 2 });
      y = doc.y + 16;
    };
    seccion('Condiciones comerciales', cot.condiciones);
    seccion('Observaciones', cot.observaciones);

    const filasBanco = [
      ['Banco', cfg.banco_nombre],
      ['Tipo de cuenta', cfg.banco_tipo_cuenta],
      ['N° de cuenta', cfg.banco_numero],
      ['Titular', cfg.banco_titular],
      ['RUT', cfg.banco_rut ? U.formatearRut(cfg.banco_rut) : ''],
      ['Correo', cfg.banco_email],
    ].filter(([, v]) => v);
    if (filasBanco.length) {
      const altoB = 26 + Math.ceil(filasBanco.length / 2) * 15 + 4;
      if (y + altoB + 10 > LIMITE_INF) {
        doc.addPage();
        y = M;
      }
      doc.roundedRect(M, y, UTIL, altoB, 6).fill(C.celesteClaro);
      doc.rect(M, y, 4, altoB).fill(C.celeste);
      doc.fillColor(C.celeste).font('Helvetica-Bold').fontSize(8.5).text('DATOS PARA TRANSFERENCIA', M + 14, y + 9, { characterSpacing: 1 });
      const anchoCol = (UTIL - 28) / 2;
      filasBanco.forEach(([k, v], i) => {
        const xx = M + 14 + (i % 2) * anchoCol;
        const yy = y + 24 + Math.floor(i / 2) * 15;
        doc.fillColor(C.gris).font('Helvetica').fontSize(8.5).text(k, xx, yy, { width: 80 });
        doc.fillColor(C.texto).font('Helvetica-Bold').fontSize(9).text(String(v), xx + 82, yy, { width: anchoCol - 90, height: 13, ellipsis: true, lineBreak: false });
      });
      y += altoB + 16;
    }
    if (cfg.pie_pdf) seccion('Información adicional', cfg.pie_pdf);

    /* ---------------- Pie de página en todas las hojas ---------------- */
    const contacto = [empresa, cfg.empresa_telefono, cfg.empresa_whatsapp && `WhatsApp ${cfg.empresa_whatsapp}`, cfg.empresa_email, cfg.empresa_web]
      .filter(Boolean)
      .join('  ·  ');
    const rango = doc.bufferedPageRange();
    for (let i = rango.start; i < rango.start + rango.count; i++) {
      doc.switchToPage(i);
      const margenOriginal = doc.page.margins.bottom;
      doc.page.margins.bottom = 0;
      doc.rect(0, ALTO - 42, ANCHO, 42).fill(C.celesteClaro);
      doc.rect(0, ALTO - 42, ANCHO, 2).fill(C.celeste);
      doc.fillColor(C.marino).font('Helvetica').fontSize(8).text(contacto, M, ALTO - 27, { width: UTIL - 80, lineBreak: false, ellipsis: true });
      doc
        .fillColor(C.gris)
        .fontSize(8)
        .text(`Página ${i - rango.start + 1} de ${rango.count}`, M + UTIL - 80, ALTO - 27, { width: 80, align: 'right', lineBreak: false });
      doc.page.margins.bottom = margenOriginal;
    }

    doc.end();
  });
}

window.generarPdfDemo = generarPdf;

})();

</script>
<script>
/* AUTOMOTRIZ JJV — Ajustes de la interfaz para la versión que corre dentro de Claude. */
(function () {
  'use strict';
  const App = window.App;
  const Demo = window.Demo;
  const { esc, $, icono } = App;
  App.importaExcel = true;
  App.enClaude = true;
  const PDFKIT = 'https://cdn.jsdelivr.net/npm/pdfkit@0.20.2/js/pdfkit.standalone.js';

  /* ---- El marco no permite diálogos nativos ni ventanas emergentes ---- */
  window.confirm = () => true;
  window.alert = (m) => App.toast(String(m));
  window.open = (url) => {
    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    return null;
  };
  try {
    Object.defineProperty(navigator, 'share', { value: undefined, configurable: true });
    Object.defineProperty(navigator, 'canShare', { value: undefined, configurable: true });
  } catch (e) {}

  /* ---- Imágenes guardadas en la base de datos ---- */
  function fuenteImagen(src) {
    if (!src) return null;
    if (src.startsWith('/api/admin/archivos/')) return Demo.foto(decodeURIComponent(src.split('/').pop().split('?')[0]));
    if (src.startsWith('/logo')) return Demo.logo();
    return null;
  }
  const revisarImagenes = (raizNodo) => {
    (raizNodo.querySelectorAll ? raizNodo.querySelectorAll('img') : []).forEach((img) => {
      const datos = fuenteImagen(img.getAttribute('src'));
      if (datos !== null) img.setAttribute('src', datos || 'data:image/gif;base64,R0lGODlhAQABAAAAACw=');
    });
  };
  const observadorImagenes = new MutationObserver((cambios) => cambios.forEach((c) => c.addedNodes.forEach((n) => n.nodeType === 1 && (n.tagName === 'IMG' ? revisarImagenes(n.parentNode || n) : revisarImagenes(n)))));
  observadorImagenes.observe(document.documentElement, { childList: true, subtree: true });

  /* ---- Descargas ---- */
  async function guardarArchivo(nombre, datos) {
    let dl = null;
    try {
      dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    } catch (e) {}
    if (dl) {
      try {
        await dl.save({ filename: nombre, data: datos });
      } catch (e) {
        if (e && e.code !== 'declined') App.toast('No fue posible descargar el archivo en esta vista.', 'error');
      }
      return;
    }
    const url = URL.createObjectURL(datos instanceof Blob ? datos : new Blob([datos]));
    const a = document.createElement('a');
    a.href = url;
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  let cargaPdfkit = null;
  function cargarPdfkit() {
    if (window.PDFDocument) return Promise.resolve();
    if (!cargaPdfkit) {
      cargaPdfkit = new Promise((ok, mal) => {
        const s = document.createElement('script');
        s.src = PDFKIT;
        s.onload = ok;
        s.onerror = () => {
          cargaPdfkit = null;
          mal(new Error('No se pudo cargar el generador de PDF. Revise su conexión.'));
        };
        document.head.appendChild(s);
      });
    }
    return cargaPdfkit;
  }

  async function descargarPdf(cot) {
    App.toast('Generando PDF…');
    try {
      await cargarPdfkit();
      const blob = await window.generarPdfDemo(cot, Demo.config());
      await guardarArchivo(`Cotizacion-${cot.numero}.pdf`, blob);
    } catch (e) {
      App.error(e);
    }
  }
  Demo.descargarPdf = descargarPdf;

  /* ---- Enlaces que en la versión publicada van al servidor ---- */
  document.addEventListener(
    'click',
    async (e) => {
      const a = e.target.closest('a[href]');
      if (!a) return;
      const href = a.getAttribute('href');
      let ruta = null;
      if (href.startsWith('/')) ruta = href;
      else if (href.startsWith(location.origin)) ruta = href.slice(location.origin.length);
      if (!ruta) return;
      e.preventDefault();
      e.stopPropagation();
      const [camino, qs] = ruta.split('?');
      let m;
      if ((m = camino.match(/^\/api\/admin\/cotizaciones\/(\d+)\/pdf$/))) {
        const cot = Demo.cotizacion(m[1]);
        if (cot) descargarPdf(cot);
      } else if ((m = camino.match(/^\/api\/admin\/exportar\/(.+)$/))) {
        if (m[1] === 'respaldo.db') return App.toast('En esta versión use el respaldo JSON.');
        const contenido = await Demo.exportar(m[1], Object.fromEntries(new URLSearchParams(qs || '')));
        if (contenido) guardarArchivo(m[1].replace('.', `-${App.hoyIso()}.`), new Blob([contenido], { type: 'text/plain' }));
      } else if (camino === '/solicitar') location.hash = '#/solicitar';
      else if (camino.startsWith('/api/admin/archivos/')) {
        const datos = Demo.foto(camino.split('/').pop());
        if (datos) App.modal(`${App.cabeceraModal('Fotografía')}<img src="${datos}" alt="" style="width:100%;border-radius:10px">`);
      }
    },
    true
  );

  /* ---- Ajustes sobre vistas existentes ---- */
  const original = { ...App.vistas };
  App.vistas.detalleCotizacion = async function (vista, id) {
    await original.detalleCotizacion(vista, id);
    const cot = Demo.cotizacion(id);
    const tarjeta = $('#enlace', vista)?.closest('.tarjeta');
    if (tarjeta && cot) {
      tarjeta.innerHTML = `<h2>Vista del cliente</h2>
        <p class="muted small">Al publicar la aplicación en internet, aquí aparecerá un enlace seguro para enviarle al cliente. Por ahora, envíe el PDF por WhatsApp: toque «Descargar PDF» y compártalo.</p>
        <a class="btn" href="#/c/${esc(cot.token)}">${icono('enlace')} Ver como la verá el cliente</a>`;
    }
  };
  App.vistas.solicitudes = async function (vista) {
    await original.solicitudes(vista);
    const aviso = $('.alerta.alerta-info', vista);
    if (aviso) aviso.innerHTML = `Formulario para sus clientes (vista previa): <a href="#/solicitar">abrir formulario</a>. Para que sus clientes lo usen desde su propio teléfono, la aplicación debe publicarse en internet.`;
  };
  App.vistas.configuracion = async function (vista) {
    await original.configuracion(vista);
    const pub = Array.from(vista.querySelectorAll('input[readonly]')).find((i) => i.value.endsWith('/solicitar'));
    if (pub) pub.closest('.enlace-copiar').outerHTML = `<p class="small muted">Vista previa: <a href="#/solicitar">abrir el formulario de clientes</a>.</p>`;
    const url = vista.querySelector('[name="url_publica"]');
    if (url) url.closest('.campo').remove();
    vista.querySelectorAll('a[href="/api/admin/exportar/respaldo.db"]').forEach((a) => a.remove());
    const usuarios = vista.querySelector('#formUsuario')?.closest('.tarjeta');
    const nube = Demo.nube && Demo.nube.activa;
    if (usuarios && nube) {
      usuarios.innerHTML = `<h2>Clave del equipo</h2><p class="small muted">Todo el equipo entra con la misma clave. Al cambiarla, los demás equipos siguen con su sesión abierta; la nueva clave se pide la próxima vez que alguien ingrese.</p>
        <div class="rejilla rejilla-2"><div class="campo"><label for="claveNueva">Nueva clave (mínimo 8 caracteres)</label><input id="claveNueva" type="password" autocomplete="new-password"></div>
        <div class="campo"><label for="claveNueva2">Repita la nueva clave</label><input id="claveNueva2" type="password" autocomplete="new-password"></div></div>
        <div class="botonera" style="margin-top:.6rem"><button class="btn" data-cambiar-clave>${icono('guardar')} Cambiar clave</button></div>`;
      usuarios.querySelector('[data-cambiar-clave]').addEventListener('click', async () => {
        const a = $('#claveNueva', usuarios).value, b = $('#claveNueva2', usuarios).value;
        if (a.length < 8) return App.toast('La clave debe tener al menos 8 caracteres.', 'error');
        if (a !== b) return App.toast('Las claves no coinciden.', 'error');
        try {
          await Demo.nube.cambiarClave(a);
          $('#claveNueva', usuarios).value = $('#claveNueva2', usuarios).value = '';
          App.toast('Clave del equipo cambiada.', 'ok');
        } catch (e) {
          App.toast('No se pudo cambiar la clave: ' + (e.message || e), 'error');
        }
      });
    } else if (usuarios) usuarios.innerHTML = `<h2>Acceso</h2><p class="small muted">En esta versión, solo usted puede abrir la aplicación con su cuenta de Claude y sus datos son privados. Los usuarios y contraseñas propios se activan en la versión publicada en internet.</p>`;
  };

  /* ---- Vista del cliente: cotización ---- */
  App.vistas.vistaCliente = async function (vista, tk) {
    await Demo.listo;
    const c = Demo.cotizacionPorToken(tk);
    if (!c) throw new Error('Cotización no encontrada.');
    const cfg = Demo.config();
    const veh = [c.vehiculo_marca, c.vehiculo_modelo, c.vehiculo_anio].filter(Boolean).join(' ');
    vista.innerHTML = `
      <div class="cabecera-vista"><a class="btn" href="#/cotizaciones/${c.id}">${icono('flecha')} Volver</a></div>
      <div class="alerta alerta-info small" style="margin-bottom:1rem">Vista previa: así verá el cliente su cotización cuando la aplicación esté publicada.</div>
      <section class="tarjeta">
        <div class="detalle-cabecera"><div><div class="muted small">N° de cotización</div><div class="numero">${esc(c.numero)}</div></div>
          <div style="text-align:right" class="small">Emitida ${App.fecha(c.fecha)}<br>Válida hasta ${App.fecha(c.vence)}</div></div>
        <p class="muted">Cliente: <strong>${esc(c.cliente_nombre)}</strong>${veh ? ` · Vehículo: <strong>${esc(veh)}</strong>` : ''}</p>
        <div class="tabla-envoltura"><table class="tabla"><thead><tr><th>Repuesto</th><th class="num">Cant.</th><th class="num">Precio</th><th class="num">Subtotal</th></tr></thead>
        <tbody>${c.items.map((i) => `<tr style="cursor:default"><td><strong>${esc(i.nombre)}</strong>${i.sku ? `<div class="muted small">SKU ${esc(i.sku)}</div>` : ''}</td><td class="num">${esc(Number(i.cantidad))}</td><td class="num">${App.clp(i.precio_unitario)}</td><td class="num"><strong>${App.clp(i.subtotal)}</strong></td></tr>`).join('')}</tbody></table></div>
        <div class="totales-panel" style="max-width:340px;margin:1rem 0 0 auto">
          ${c.descuento_total ? `<div class="linea"><span>Descuentos</span><span>-${App.clp(c.descuento_total)}</span></div>` : ''}
          ${c.aplica_iva ? `<div class="linea"><span>Neto</span><span>${App.clp(c.neto)}</span></div><div class="linea"><span>IVA (19 %)</span><span>${App.clp(c.iva)}</span></div>` : ''}
          <div class="linea total"><span>Total</span><span>${App.clp(c.total)}</span></div></div>
        ${c.observaciones ? `<h3 style="margin-top:1rem">Observaciones</h3><p class="pre">${esc(c.observaciones)}</p>` : ''}
        ${c.condiciones ? `<h3>Condiciones comerciales</h3><p class="pre">${esc(c.condiciones)}</p>` : ''}
        <div class="acciones-principales"><button class="btn btn-primario btn-grande" data-pdf>${icono('descargar')} Descargar PDF</button></div>
      </section>
      <p class="muted small" style="text-align:center">${esc([cfg.empresa_nombre, cfg.empresa_direccion, cfg.empresa_telefono, cfg.empresa_email].filter(Boolean).join(' · '))}</p>`;
    $('[data-pdf]', vista).addEventListener('click', () => descargarPdf(c));
  };

  /* ---- Vista del cliente: formulario de solicitud ---- */
  App.vistas.formularioCliente = async function (vista) {
    const campo = (id, label, extra = '', clase = '') => `<div class="campo ${clase}"><label for="f_${id}">${label}</label><input id="f_${id}" name="${id}" ${extra}></div>`;
    vista.innerHTML = `
      <div class="alerta alerta-info small" style="margin-bottom:1rem">Vista previa del formulario público. Lo que envíe aquí aparecerá en «Solicitudes» como si lo hubiera enviado un cliente.</div>
      <div id="formVista">
        <h1>Solicite su cotización de repuestos</h1>
        <p class="muted">Complete el formulario y le enviaremos la cotización por WhatsApp. No necesita crear una cuenta.</p>
        <div id="erroresSol" class="alerta alerta-error" hidden style="margin-bottom:1rem"></div>
        <form id="formSolDemo" novalidate>
          <section class="tarjeta"><h2>Sus datos</h2><div class="rejilla rejilla-2">
            ${campo('nombre', 'Nombre completo *', 'autocomplete="name"', 'col-2')}${campo('rut', 'RUT *', 'placeholder="12.345.678-9"')}
            ${campo('telefono', 'Teléfono o WhatsApp *', 'type="tel" inputmode="tel" placeholder="+56 9 1234 5678"')}${campo('email', 'Correo electrónico (opcional)', 'type="email" inputmode="email"', 'col-2')}
          </div></section>
          <section class="tarjeta"><h2>Vehículo</h2><div class="rejilla rejilla-3">
            ${campo('marca', 'Marca *', 'placeholder="Ej: Toyota"')}${campo('modelo', 'Modelo *', 'placeholder="Ej: Yaris"')}${campo('anio', 'Año *', 'inputmode="numeric" maxlength="4" placeholder="Ej: 2018"')}
          </div></section>
          <section class="tarjeta"><h2>Repuesto que necesita</h2><div class="rejilla rejilla-2">
            ${campo('repuesto', 'Nombre del repuesto *', 'placeholder="Ej: pastillas de freno delanteras"', 'col-2')}${campo('sku_oem', 'SKU o código OEM (si lo conoce)')}${campo('cantidad', 'Cantidad *', 'inputmode="numeric" value="1"')}
            <div class="campo col-2"><label for="f_obs">Observaciones adicionales</label><textarea id="f_obs" name="observaciones" placeholder="Ej: versión del motor, número de chasis (VIN)…"></textarea></div>
            <div class="campo col-2"><label for="f_foto">Fotografía del repuesto (opcional)</label><input id="f_foto" name="foto" type="file" accept="image/jpeg,image/png,image/webp"></div>
          </div></section>
          <button class="btn btn-primario btn-grande btn-bloque" type="submit" style="margin-top:1rem">Solicitar cotización</button>
        </form>
      </div>
      <section class="tarjeta" id="okSol" hidden style="text-align:center"><h1>¡Solicitud recibida!</h1><p>Su número de solicitud es:</p>
        <div id="numSol" style="display:inline-block;padding:.6rem 1.2rem;border-radius:10px;background:var(--marino);color:#fff;font-size:1.4rem;font-weight:800"></div>
        <p>Prepararemos su cotización y le contactaremos al teléfono indicado.</p>
        <div class="botonera" style="justify-content:center"><a class="btn" href="#/solicitudes">Ver en Solicitudes</a><button class="btn" data-otra>Hacer otra solicitud</button></div></section>`;
    const rut = $('#f_rut', vista);
    App.prepararRut(rut);
    $('[data-otra]', vista).addEventListener('click', () => App.ir('#/solicitar'));
    $('#formSolDemo', vista).addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const fd = new FormData(ev.target);
      const err = $('#erroresSol', vista);
      try {
        const r = await App.api('POST', '/api/publico/solicitudes', fd, { formulario: true });
        $('#numSol', vista).textContent = r.numero;
        $('#formVista', vista).hidden = true;
        $('#okSol', vista).hidden = false;
        App.actualizarPendientes();
        window.scrollTo(0, 0);
      } catch (e) {
        err.textContent = e.message;
        err.hidden = false;
        err.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    });
  };

  App.rutas.push([/^#\/c\/([A-Za-z0-9_-]+)$/, 'vistaCliente', 'historial'], [/^#\/solicitar$/, 'formularioCliente', 'solicitudes']);

  /* ---- Inicio ---- */
  Demo.listo.then(() => {
    const aviso = document.getElementById('avisoDemo');
    const donde = {
      nube: 'Sus datos se guardan de forma privada en su cuenta de Claude y los verá en el celular y en el computador.',
      equipo: 'Datos compartidos con todo el equipo.',
      navegador: 'Sus datos se guardan solo en este navegador.',
      memoria: 'Los datos no se guardarán al cerrar esta vista.',
    }[Demo.almacen];
    aviso.textContent = Demo.almacen === 'equipo' ? `${donde} Vendedor: ${Demo.nube.usuario.nombre}` : window.claude ? `Versión para usar dentro de Claude. ${donde}` : donde;
    App.iniciar().then(() => {
      const c = Demo.cargaInicial;
      if (c && (c.creados || c.actualizados)) App.toast(`Catálogo de Contabilium cargado: ${c.creados.toLocaleString('es-CL')} repuestos nuevos, ${c.actualizados} actualizados.`, 'ok');
    });
  });
})();

</script>
</body>
</html>
