  });

  /* ---- Configuración ---- */
  const CLAVES = ['empresa_nombre', 'empresa_rut', 'empresa_giro', 'empresa_direccion', 'empresa_telefono', 'empresa_whatsapp', 'empresa_email', 'empresa_web', 'vigencia_dias', 'precios_con_iva', 'aplica_iva', 'prefijo_cotizacion', 'prefijo_solicitud', 'condiciones', 'pie_pdf', 'url_publica', 'banco_nombre', 'banco_tipo_cuenta', 'banco_numero', 'banco_titular', 'banco_rut', 'banco_email'];
  ruta('GET', '/api/admin/configuracion', () => ({ ...cfg() }));
  ruta('PUT', '/api/admin/configuracion', (p, q, b) => {
    const o = {};
    const err = [];
    for (const k of CLAVES) if (b[k] !== undefined) o[k] = txt(b[k], k === 'condiciones' || k === 'pie_pdf' ? 4000 : 250);
    if (o.empresa_nombre !== undefined && !o.empresa_nombre) err.push('El nombre de la empresa es obligatorio.');
    if (o.empresa_rut) {
      if (!U.validarRut(o.empresa_rut)) err.push('El RUT de la empresa no es válido.');
      else o.empresa_rut = U.normalizarRut(o.empresa_rut);
    }
    if (o.empresa_email && !U.validarEmail(o.empresa_email)) err.push('El correo de la empresa no es válido.');
    if (o.vigencia_dias !== undefined) {
      const v = parseInt(o.vigencia_dias, 10);
      if (!(v >= 1 && v <= 365)) err.push('La vigencia debe estar entre 1 y 365 días.');
      else o.vigencia_dias = String(v);
    }
    for (const k of ['precios_con_iva', 'aplica_iva']) if (o[k] !== undefined) o[k] = ['1', 'true', 'on'].includes(String(b[k])) ? '1' : '0';
    if (o.prefijo_cotizacion !== undefined && !/^[A-Za-z0-9-]{0,10}$/.test(o.prefijo_cotizacion)) err.push('Prefijo de cotización no válido.');
    if (o.prefijo_solicitud !== undefined && !/^[A-Za-z0-9-]{0,10}$/.test(o.prefijo_solicitud)) err.push('Prefijo de solicitud no válido.');
    if (err.length) fallo(400, err.join(' '));
    Object.assign(cfg(), o);
    guardarMeta();
    return { ...cfg() };
  });
  ruta('POST', '/api/admin/configuracion/logo', async (p, q, b) => {
    if (!b.logo) fallo(400, 'Seleccione una imagen PNG o JPG.');
    if (!/^image\/(png|jpeg)$/.test(b.logo.type)) fallo(400, 'Use una imagen PNG o JPG.');
    const k = await guardarImagen(b.logo, { max: 700, png: b.logo.type === 'image/png' });
    borrarImagen(cfg().logo);
    cfg().logo = k;
    guardarMeta();
    return { logo: k };
  });
  ruta('DELETE', '/api/admin/configuracion/logo', () => {
    borrarImagen(cfg().logo);
    cfg().logo = '';
    guardarMeta();
    return { ok: true };
  });

  /* ---- Usuarios (en la demo, el acceso lo controla Claude) ---- */
  ruta('GET', '/api/admin/usuarios', () => [{ id: 1, usuario: USUARIO, nombre: 'Administrador', activo: 1, creado: '' }]);
  const soloPublicada = () => fallo(400, 'En esta versión el acceso lo controla su cuenta de Claude. Los usuarios y contraseñas se gestionan en la versión publicada.');
  ruta('POST', '/api/admin/usuarios', soloPublicada);
  ruta('PUT', '/api/admin/usuarios/password', soloPublicada);
  ruta('DELETE', '/api/admin/usuarios/:id', soloPublicada);

  /* ============================ Intercepción de fetch ============================ */
  async function leerCuerpo(body) {
    if (!body) return {};
    if (body instanceof FormData) {
      const o = {};
      for (const [k, v] of body.entries()) o[k] = v;
      return o;
    }
    try {
      return JSON.parse(body);
    } catch {
      return {};
    }
  }
  const responder = (status, datos) => new Response(JSON.stringify(datos), { status, headers: { 'Content-Type': 'application/json' } });
  const fetchOriginal = window.fetch.bind(window);

  window.fetch = async function (entrada, op = {}) {
    const url = typeof entrada === 'string' ? entrada : entrada.url;
    if (!url.startsWith('/api/')) return fetchOriginal(entrada, op);
    await listo;
    const [ruta_, qs] = url.split('?');
    const metodo = (op.method || 'GET').toUpperCase();
    const q = Object.fromEntries(new URLSearchParams(qs || ''));
    if (Nube.activa) USUARIO = Nube.usuario.nombre;
    if (Nube.activa && metodo !== 'GET') {
      try {
        await Nube.prepararReservas(ruta_);
      } catch (e) {
        console.error(e);
        return responder(503, { error: 'Sin conexión con la base de datos. Revise internet e intente nuevamente.' });
      }
    }
    for (const [m, re, fn] of R) {
      if (m !== metodo) continue;
      const k = ruta_.match(re);
      if (!k) continue;
      try {
        const r = await fn(k.slice(1), q, await leerCuerpo(op.body));
        return responder(metodo === 'POST' && /\/(cotizaciones|clientes|productos|solicitudes)$/.test(ruta_) ? 201 : 200, r);
      } catch (e) {
        if (e instanceof Err) return responder(e.status, { error: e.message });
        console.error(e);
        return responder(500, { error: 'Ocurrió un error interno. Intente nuevamente.' });
      }
    }
    return responder(404, { error: 'Recurso no encontrado.' });
  };
})();

</script>
<script>
/* AUTOMOTRIZ JJV — Núcleo del panel: API, utilidades de interfaz, enrutador y diseño. */
(function () {
  'use strict';
  const App = (window.App = { vistas: {}, estado: { usuario: null, empresa: {}, pendientes: 0 }, importaExcel: true });

  /* ------------------------------ Utilidades ------------------------------ */
  const esc = (s) =>
    String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const $ = (sel, el = document) => el.querySelector(sel);
  const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));
  const clp = (n) => JJV.clp(n);
  const fecha = (f) => JJV.fechaCl(f);
  const fechaHora = (f) => (f ? `${JJV.fechaCl(f.slice(0, 10))} ${f.slice(11, 16)}` : '');
  const debounce = (fn, ms = 250) => {
    let t;
    return (...a) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...a), ms);
    };
  };
  const badge = (estado) => `<span class="badge estado-${esc(String(estado).toLowerCase())}">${esc(estado)}</span>`;
  const hoyIso = () => new Date().toLocaleDateString('en-CA', { timeZone: 'America/Santiago' });
  Object.assign(App, { esc, $, $$, clp, fecha, fechaHora, debounce, badge, hoyIso });

  /* ------------------------------ API ------------------------------ */
  async function api(metodo, url, cuerpo, { formulario = false } = {}) {
    const op = { method: metodo, credentials: 'same-origin', headers: { 'X-JJV': '1' } };
    if (cuerpo !== undefined) {
      if (formulario) op.body = cuerpo;
      else {
        op.headers['Content-Type'] = 'application/json';
        op.body = JSON.stringify(cuerpo);
      }
    }
    let r;
    try {
      r = await fetch(url, op);
    } catch (e) {
      throw new Error('Sin conexión con el servidor. Revise su conexión a internet.');
    }
    if (r.status === 401) {
      location.href = '/login?volver=' + encodeURIComponent(location.pathname + location.hash);
      throw new Error('Sesión expirada.');
    }
    const tipo = r.headers.get('content-type') || '';
    const datos = tipo.includes('json') ? await r.json() : await r.text();
    if (!r.ok) {
      const e = new Error((datos && datos.error) || 'Ocurrió un error.');
      e.status = r.status;
      e.datos = datos;
      throw e;
    }
    return datos;
  }
  App.api = api;
  App.get = (u) => api('GET', u);
  App.post = (u, b) => api('POST', u, b ?? {});
  App.put = (u, b) => api('PUT', u, b ?? {});
  App.patch = (u, b) => api('PATCH', u, b ?? {});
  App.del = (u) => api('DELETE', u);

  /* ------------------------------ Avisos ------------------------------ */
  App.toast = function (mensaje, tipo = '') {
    const cont = $('#toasts');
    const el = document.createElement('div');
    el.className = 'toast' + (tipo ? ' toast-' + tipo : '');
    el.setAttribute('role', 'status');
    el.textContent = mensaje;
    cont.appendChild(el);
    setTimeout(() => el.remove(), tipo === 'error' ? 6000 : 3500);
  };
  App.error = (e) => App.toast(e.message || String(e), 'error');

  /* ------------------------------ Modales ------------------------------ */
  App.modal = function (html, { alMontar, alCerrar } = {}) {
    const fondo = document.createElement('div');
    fondo.className = 'modal-fondo';
    fondo.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
    const cerrar = () => {
      fondo.remove();
      document.removeEventListener('keydown', tecla);
      document.body.style.overflow = '';
      if (alCerrar) alCerrar();
    };
    const tecla = (e) => e.key === 'Escape' && cerrar();
    fondo.addEventListener('mousedown', (e) => e.target === fondo && cerrar());
    fondo.addEventListener('click', (e) => e.target.closest('[data-cerrar]') && cerrar());
    document.addEventListener('keydown', tecla);
    $('#modales').appendChild(fondo);
    document.body.style.overflow = 'hidden';
    const el = $('.modal', fondo);
    if (alMontar) alMontar(el, cerrar);
    const primero = $('input:not([type=hidden]):not([readonly]), textarea, select', el);
    if (primero && window.innerWidth > 720) primero.focus();
    return { el, cerrar };
  };

  App.confirmar = function (mensaje, { titulo = 'Confirmar', boton = 'Aceptar', peligro = false } = {}) {
    return new Promise((ok) => {
      let resp = false;
      App.modal(
        `<div class="modal-cabecera"><h2>${esc(titulo)}</h2></div><p>${esc(mensaje)}</p>
         <div class="modal-pie"><button class="btn" data-cerrar>Cancelar</button>
         <button class="btn ${peligro ? 'btn-peligro' : 'btn-primario'}" data-ok>${esc(boton)}</button></div>`,
        {
          alMontar: (el, cerrar) =>
            $('[data-ok]', el).addEventListener('click', () => {
              resp = true;
              cerrar();
            }),
          alCerrar: () => ok(resp),
        }
      );
    });
  };

  App.cabeceraModal = (titulo) =>
    `<div class="modal-cabecera"><h2>${esc(titulo)}</h2><button class="btn btn-texto btn-icono" data-cerrar aria-label="Cerrar">${App.icono('x')}</button></div>`;

  /* ------------------------------ Copiar ------------------------------ */
  App.copiar = async function (texto, aviso = 'Copiado al portapapeles') {
    try {
      await navigator.clipboard.writeText(texto);
    } catch {
      const t = document.createElement('textarea');
      t.value = texto;
      document.body.appendChild(t);
      t.select();
      document.execCommand('copy');
      t.remove();
    }
    App.toast(aviso, 'ok');
  };

  /* ------------------------------ Autocompletado ------------------------------ */
  /**
   * App.autocompletar(input, { buscar(q) → Promise<array>, render(item) → html, elegir(item), min })
   * El input debe estar dentro de un elemento con clase "autocompletar".
   */
  App.autocompletar = function (input, { buscar, render, elegir, min = 2 }) {
    input.setAttribute('autocomplete', 'off');
    const contenedor = input.closest('.autocompletar') || input.parentElement;
    let lista = null;
    let items = [];
    let activo = -1;
    let t;
    const cerrar = () => {
      if (lista) lista.remove();
      lista = null;
      activo = -1;
    };
    const marcar = () => $$('.sugerencia', lista).forEach((s, i) => s.classList.toggle('activa', i === activo));
    const mostrar = () => {
      cerrar();
      if (!items.length || document.activeElement !== input) return;
      lista = document.createElement('div');
      lista.className = 'sugerencias';
      lista.setAttribute('role', 'listbox');
      lista.innerHTML = items.map((it, i) => `<div class="sugerencia" role="option" data-i="${i}">${render(it)}</div>`).join('');
      lista.addEventListener('mousedown', (e) => {
        const s = e.target.closest('.sugerencia');
        if (!s) return;
        e.preventDefault();
        const it = items[Number(s.dataset.i)];
        cerrar();
        elegir(it);
      });
      contenedor.appendChild(lista);
    };
    input.addEventListener('input', () => {
      clearTimeout(t);
      const q = input.value.trim();
      if (q.length < min) return cerrar();
      t = setTimeout(async () => {
        try {
          const r = await buscar(q);
          if (input.value.trim() !== q) return;
          items = r || [];
          mostrar();
        } catch (e) {
          /* silencioso */
        }
      }, 180);
    });
    input.addEventListener('keydown', (e) => {
      if (!lista) return;
      if (e.key === 'ArrowDown') {
        activo = Math.min(activo + 1, items.length - 1);
        marcar();
        e.preventDefault();
      } else if (e.key === 'ArrowUp') {
        activo = Math.max(activo - 1, 0);
        marcar();
        e.preventDefault();
      } else if (e.key === 'Enter' && activo >= 0) {
        e.preventDefault();
        const it = items[activo];
        cerrar();
        elegir(it);
      } else if (e.key === 'Escape') cerrar();
    });
    input.addEventListener('blur', () => setTimeout(cerrar, 150));
  };

  /* Sugerencia estándar de repuesto */
  App.renderProducto = (p) =>
    `${p.foto ? `<img class="miniatura" src="/api/admin/archivos/${esc(p.foto)}" alt="">` : ''}
     <div style="min-width:0"><div class="s-titulo">${esc(p.nombre)}</div>
     <div class="s-sub">SKU ${esc(p.sku)}${p.oem ? ' · OEM ' + esc(p.oem) : ''}${p.marca ? ' · ' + esc([p.marca, p.modelo, p.anio].filter(Boolean).join(' ')) : ''}${p.stock != null ? ' · Stock ' + esc(p.stock) : ''}</div></div>
     <div class="s-precio">${clp(p.precio)}</div>`;
  App.renderCliente = (c) =>
    `<div style="min-width:0"><div class="s-titulo">${esc(c.nombre)}</div>
     <div class="s-sub">${c.rut ? esc(JJV.formatearRut(c.rut)) + ' · ' : ''}${esc(c.whatsapp || c.telefono || '')}</div></div>`;

  /* ------------------------------ Campo RUT ------------------------------ */
  App.prepararRut = function (input, { alValidar } = {}) {
    input.setAttribute('inputmode', 'text');
    input.setAttribute('autocapitalize', 'characters');
    const revisar = () => {
      const v = input.value.trim();
      input.classList.remove('invalido', 'valido');
      if (!v) return alValidar && alValidar(null);
      if (JJV.validarRut(v)) {
        input.value = JJV.formatearRut(v);
        input.classList.add('valido');
        alValidar && alValidar(JJV.normalizarRut(v));
      } else {
        input.classList.add('invalido');
        alValidar && alValidar(false);
      }
    };
    input.addEventListener('blur', revisar);
    input.addEventListener('input', () => {
      const limpio = JJV.limpiarRut(input.value);
      if (limpio.length >= 8 && JJV.validarRut(limpio)) revisar();
    });
    return revisar;
  };

  /* ------------------------------ Íconos ------------------------------ */
  const RUTAS_ICONOS = {
    inicio: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    mas: '<path d="M12 5v14M5 12h14"/>',
    bandeja: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13l3.5 7v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>',
    historial: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',
    catalogo: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
    clientes: '<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M17 11a3 3 0 1 0 0-6M22 21a6 6 0 0 0-4-5.6"/>',
    config: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
    menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
    buscar: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
    x: '<path d="M18 6 6 18M6 6l12 12"/>',
    pdf: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 18v-6M9 15l3 3 3-3"/>',
    imprimir: '<path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/>',
    compartir: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>',
    whatsapp: '<path d="M3 21l1.7-5A8.5 8.5 0 1 1 8 19.4z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1.2-1.4-2-1-1 .8a4 4 0 0 1-2.1-2.1l.8-1-1-2z"/>',
    editar: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
    duplicar: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
    basura: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
    salir: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
    enlace: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
    descargar: '<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
    subir: '<path d="M12 21V9M7 14l5-5 5 5M5 3h14"/>',
    guardar: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    flecha: '<path d="M15 18l-6-6 6-6"/>',
    documento: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  };
  App.icono = (n) =>
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${RUTAS_ICONOS[n] || ''}</svg>`;

  /* ------------------------------ Diseño y navegación ------------------------------ */
  const NAV = [
    { ruta: '#/', id: 'inicio', texto: 'Resumen', icono: 'inicio' },
    { ruta: '#/cotizaciones/nueva', id: 'nueva', texto: 'Nueva cotización', icono: 'mas' },
    { ruta: '#/solicitudes', id: 'solicitudes', texto: 'Solicitudes', icono: 'bandeja' },
    { ruta: '#/historial', id: 'historial', texto: 'Historial', icono: 'historial' },
    { ruta: '#/catalogo', id: 'catalogo', texto: 'Catálogo', icono: 'catalogo' },
    { ruta: '#/clientes', id: 'clientes', texto: 'Clientes', icono: 'clientes' },
    { ruta: '#/configuracion', id: 'configuracion', texto: 'Configuración', icono: 'config' },
  ];

  function marcaHtml() {
    const e = App.estado.empresa;
    return e.logo
      ? `<img class="marca-logo-mini${e.logoBase ? ' base' : ''}" src="/logo?v=${Date.now() % 100000}" alt="AUTOMOTRIZ JJV">`
      : `<span class="marca-sello">JJV</span>`;
  }

  function pintarDiseno() {
    const pend = App.estado.pendientes;
    const punto = pend ? `<span class="punto">${pend > 99 ? '99+' : pend}</span>` : '';
    $('#lateral').innerHTML = `
      <a class="marca" href="#/">${marcaHtml()}<span>${esc(App.estado.empresa.nombre || 'AUTOMOTRIZ JJV')}<small>Sistema de Cotizaciones</small></span></a>
      <nav>${NAV.map((n) => `<a href="${n.ruta}" data-nav="${n.id}">${App.icono(n.icono)}<span>${n.texto}</span>${n.id === 'solicitudes' ? punto : ''}</a>`).join('')}</nav>
      <div class="pie-lateral">Sesión: <strong>${esc(App.estado.usuario?.nombre || '')}</strong>
        <button class="btn" data-salir>${App.icono('salir')} Cerrar sesión</button></div>`;
    $('#superior').innerHTML = `
      <a class="marca" href="#/">${marcaHtml()}<span>${esc(App.estado.empresa.nombre || 'AUTOMOTRIZ JJV')}</span></a>
      <button class="btn" data-salir aria-label="Cerrar sesión">${App.icono('salir')}</button>`;
    const movil = [NAV[0], NAV[2], NAV[1], NAV[3]];
    $('#inferior').innerHTML =
      movil
        .map(
          (n) =>
            `<a href="${n.ruta}" data-nav="${n.id}" class="${n.id === 'nueva' ? 'nuevo' : ''}">${App.icono(n.icono)}<span>${n.id === 'nueva' ? 'Nueva' : n.texto}</span>${n.id === 'solicitudes' ? punto : ''}</a>`
        )
        .join('') + `<button data-mas data-nav="mas">${App.icono('menu')}<span>Más</span></button>`;
    $('#menuMas').innerHTML = NAV.slice(4)
      .map((n) => `<a href="${n.ruta}">${App.icono(n.icono)}${n.texto}</a>`)
      .join('');
  }

  function marcarActivo(id) {
    $$('[data-nav]').forEach((a) => a.classList.toggle('activo', a.dataset.nav === id || (id && ['catalogo', 'clientes', 'configuracion'].includes(id) && a.dataset.nav === 'mas')));
  }

  App.actualizarPendientes = async function () {
    try {
      const r = await App.get('/api/admin/solicitudes?estado=Pendiente');
      App.estado.pendientes = r.filas.length;
      $$('.punto').forEach((p) => p.remove());
      if (App.estado.pendientes) {
        $$('[data-nav="solicitudes"]').forEach((a) => a.insertAdjacentHTML('beforeend', `<span class="punto">${App.estado.pendientes}</span>`));
      }
    } catch {}
  };

  document.addEventListener('click', async (e) => {
    if (e.target.closest('[data-salir]')) {
      await App.post('/api/auth/logout').catch(() => {});
      location.reload();
    } else if (e.target.closest('[data-mas]')) {
      $('#menuMas').hidden = !$('#menuMas').hidden;
    } else if (!e.target.closest('#menuMas')) {
      $('#menuMas').hidden = true;
    }
  });

  /* ------------------------------ Enrutador ------------------------------ */
  const RUTAS = [
    [/^#?\/?$/, 'resumen', 'inicio'],
    [/^#\/cotizaciones\/nueva$/, 'formCotizacion', 'nueva'],
    [/^#\/cotizaciones\/(\d+)\/editar$/, 'formCotizacion', 'historial'],
    [/^#\/cotizaciones\/(\d+)$/, 'detalleCotizacion', 'historial'],
    [/^#\/historial$/, 'historial', 'historial'],
    [/^#\/solicitudes$/, 'solicitudes', 'solicitudes'],
    [/^#\/solicitudes\/(\d+)$/, 'detalleSolicitud', 'solicitudes'],
    [/^#\/catalogo$/, 'catalogo', 'catalogo'],
    [/^#\/clientes$/, 'clientes', 'clientes'],
    [/^#\/clientes\/(\d+)$/, 'detalleCliente', 'clientes'],
    [/^#\/configuracion$/, 'configuracion', 'configuracion'],
  ];

  App.rutas = RUTAS;
  App.cambiosSinGuardar = false;
  App.params = () => new URLSearchParams((location.hash.split('?')[1] || ''));
  App.ir = (ruta) => {
    if (location.hash === ruta) enrutar();
    else location.hash = ruta;
  };

  let hashAnterior = location.hash;
  async function enrutar() {
    if (App.cambiosSinGuardar && hashAnterior !== location.hash) {
      if (!confirm('Hay cambios sin guardar en la cotización. ¿Desea salir de todas formas?')) {
        history.replaceState(null, '', hashAnterior || '#/');
        return;
      }
    }
    App.cambiosSinGuardar = false;
    hashAnterior = location.hash;
    $('#menuMas').hidden = true;
    const ruta = (location.hash || '#/').split('?')[0];
    const coincide = RUTAS.find(([re]) => re.test(ruta));
    // Se reemplaza el contenedor para descartar los eventos de la vista anterior
    const anterior = $('#vista');
    const vista = document.createElement('main');
    vista.id = 'vista';
    vista.className = 'contenido';
    anterior.replaceWith(vista);
    if (!coincide) {
      vista.innerHTML = `<div class="vacio"><h2>Página no encontrada</h2><a class="btn" href="#/">Volver al resumen</a></div>`;
      return;
    }
    const [re, nombre, nav] = coincide;
    const args = ruta.match(re).slice(1);
    marcarActivo(nav);
    vista.innerHTML = '<div class="cargando"><div class="spinner"></div></div>';
    window.scrollTo(0, 0);
    try {
      await App.vistas[nombre](vista, ...args);
    } catch (e) {
      vista.innerHTML = `<div class="tarjeta"><div class="alerta alerta-error">${esc(e.message)}</div><p><a class="btn" href="#/">Volver al resumen</a></p></div>`;
    }
  }
  window.addEventListener('hashchange', enrutar);
  window.addEventListener('beforeunload', (e) => {
    if (App.cambiosSinGuardar) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  /* ------------------------------ Inicio ------------------------------ */
  App.iniciar = async function () {
    try {
      const yo = await App.get('/api/auth/yo');
      App.estado.usuario = yo.usuario;
    } catch {
      return;
    }
    App.estado.empresa = await App.get('/api/publico/empresa');
    pintarDiseno();
    App.actualizarPendientes();
    setInterval(App.actualizarPendientes, 60000);
    enrutar();
  };
  App.repintarDiseno = async () => {
    App.estado.empresa = await App.get('/api/publico/empresa');
    pintarDiseno();
    marcarActivo((RUTAS.find(([re]) => re.test((location.hash || '#/').split('?')[0])) || [])[2]);
    App.actualizarPendientes();
  };
})();

</script>
<script>
/* AUTOMOTRIZ JJV — Vistas: resumen, formulario de cotización, detalle, historial y WhatsApp. */
(function () {
  'use strict';
  const { esc, $, $$, clp, fecha, fechaHora, badge, icono } = window.App;
  const App = window.App;

  /* ================================ RESUMEN ================================ */
  App.vistas.resumen = async function (vista) {
    const d = await App.get('/api/admin/resumen');
    const k = d.porEstado;
    const kpi = (estado, rotulo, clase) =>
      `<a class="kpi ${clase}" href="#/historial?estado=${estado}"><div class="valor">${k[estado] || 0}</div><div class="rotulo">${rotulo}</div></a>`;
    vista.innerHTML = `
      <div class="cabecera-vista"><div><h1>Resumen</h1><p class="muted">Hola, ${esc(App.estado.usuario.nombre)}. Este es el estado de sus cotizaciones.</p></div>
        <a class="btn btn-primario btn-grande" href="#/cotizaciones/nueva">${icono('mas')} Nueva cotización</a></div>
      <div class="kpis">
        ${kpi('Pendiente', 'Pendientes', 'k-pendiente')}${kpi('Enviada', 'Enviadas', 'k-enviada')}
        ${kpi('Aprobada', 'Aprobadas', 'k-aprobada')}${kpi('Rechazada', 'Rechazadas', 'k-rechazada')}
      </div>
      <div class="resumen-mes">
        <a class="franja" href="#/solicitudes" style="text-decoration:none"><div class="rotulo">Solicitudes de clientes por atender</div><div class="valor">${d.solicitudesPendientes}</div></a>
        <div class="franja"><div class="rotulo">Cotizado este mes (${d.cotizadoMes.n})</div><div class="valor">${clp(d.cotizadoMes.t)}</div></div>
        <div class="franja"><div class="rotulo">Aprobado este mes (${d.aprobadoMes.n})</div><div class="valor">${clp(d.aprobadoMes.t)}</div></div>
      </div>
      ${k.Vencida ? `<p class="muted small">Vencidas: ${k.Vencida} · <a href="#/historial?estado=Vencida">ver</a></p>` : ''}
      <div class="dos-columnas">
        <section class="tarjeta"><div class="tarjeta-titulo"><h2>Últimas cotizaciones</h2><a href="#/historial">Ver todas</a></div>
          ${d.recientes.length ? `<div class="lista">${d.recientes.map(filaCotizacion).join('')}</div>` : vacio('Aún no hay cotizaciones.', '#/cotizaciones/nueva', 'Crear la primera')}
        </section>
        <section class="tarjeta"><div class="tarjeta-titulo"><h2>Solicitudes pendientes</h2><a href="#/solicitudes">Ver todas</a></div>
          ${
            d.solicitudes.length
              ? `<div class="lista">${d.solicitudes
                  .map(
                    (s) => `<a class="fila-tarjeta" href="#/solicitudes/${s.id}"><div class="linea"><span class="titulo">${esc(s.nombre)}</span><span class="muted small">${esc(s.numero)}</span></div>
                <div class="sub">${esc(s.repuesto)} · ${esc([s.marca, s.modelo, s.anio].filter(Boolean).join(' '))}</div></a>`
                  )
                  .join('')}</div>`
              : vacio('No hay solicitudes pendientes.')
          }
        </section>
      </div>`;
  };

  function vacio(texto, ruta, boton) {
    return `<div class="vacio">${icono('documento')}<p>${esc(texto)}</p>${ruta ? `<a class="btn" href="${ruta}">${esc(boton)}</a>` : ''}</div>`;
  }
  App.vacio = vacio;

  function filaCotizacion(c) {
    return `<a class="fila-tarjeta" href="#/cotizaciones/${c.id}">
      <div class="linea"><span class="titulo">${esc(c.numero)}</span>${badge(c.estado)}</div>
      <div class="linea"><span class="sub">${esc(c.cliente_nombre)} · ${fecha(c.fecha)}</span><span class="monto">${clp(c.total)}</span></div>
      ${c.resumen ? `<div class="sub">${esc(c.resumen)}</div>` : ''}</a>`;
  }
  App.filaCotizacion = filaCotizacion;

  /* ========================== FORMULARIO DE COTIZACIÓN ========================== */
  App.vistas.formCotizacion = async function (vista, idEditar) {
    const params = App.params();
    const [cfg] = await Promise.all([App.get('/api/admin/configuracion')]);
    let entrada;
    let titulo = 'Nueva cotización';
    let subtitulo = 'Complete los datos y la cotización se numerará automáticamente al guardar.';
    let cotEditada = null;

    if (idEditar) {
      cotEditada = await App.get(`/api/admin/cotizaciones/${idEditar}`);
      entrada = await App.get(`/api/admin/cotizaciones/${idEditar}/entrada`);
      titulo = `Editar ${cotEditada.numero}`;
      subtitulo = 'Al guardar se conserva la versión anterior en el historial.';
    } else if (params.get('solicitud')) {
      entrada = await App.get(`/api/admin/solicitudes/${Number(params.get('solicitud'))}/entrada`);
      subtitulo = 'Datos cargados desde la solicitud del cliente. Revise precios y guarde.';
    } else {
      entrada = {
        cliente: {},
        vehiculo: {},
        items: [],
        vigencia_dias: Number(cfg.vigencia_dias) || 7,
        condiciones: cfg.condiciones || '',
      };
      if (params.get('cliente')) {
        const c = await App.get(`/api/admin/clientes/${Number(params.get('cliente'))}`);
        entrada.cliente = { nombre: c.nombre, rut: c.rut, telefono: c.telefono, whatsapp: c.whatsapp, email: c.email };
      }
    }
    const st = {
      cliente: Object.assign({ nombre: '', rut: '', telefono: '', whatsapp: '', email: '' }, entrada.cliente || {}),
      vehiculo: Object.assign({ marca: '', modelo: '', anio: '' }, entrada.vehiculo || {}),
      items: (entrada.items || []).map(normalizarItem),
      precios_con_iva: entrada.precios_con_iva ?? cfg.precios_con_iva === '1',
      aplica_iva: entrada.aplica_iva ?? cfg.aplica_iva === '1',
      descuento_global_pct: entrada.descuento_global_pct || 0,
      vigencia_dias: entrada.vigencia_dias || Number(cfg.vigencia_dias) || 7,
      condiciones: entrada.condiciones || '',
      observaciones: entrada.observaciones || '',
      notas_internas: entrada.notas_internas || '',
      vendedor: entrada.vendedor || (() => { try { return localStorage.getItem('jjv-vendedor') || ''; } catch (e) { return ''; } })() || (window.Demo.nube && window.Demo.nube.activa ? window.Demo.nube.usuario.nombre : ''),
      solicitud_id: entrada.solicitud_id || null,
    };
    if (st.cliente.rut) st.cliente.rut = JJV.formatearRut(st.cliente.rut);
    if (!st.items.length) st.items.push(normalizarItem({}));

    vista.classList.add('con-barra-total');
    vista.innerHTML = `
      <div class="cabecera-vista"><div><h1>${esc(titulo)}</h1><p class="muted">${esc(subtitulo)}</p></div>
        ${idEditar ? `<a class="btn" href="#/cotizaciones/${idEditar}">${icono('flecha')} Volver</a>` : ''}</div>
      <div id="errores"></div>
      <form id="formCot" novalidate>
        <section class="tarjeta seccion-form"><div class="tarjeta-titulo"><h2>Vendedor</h2></div>
          <div class="campo"><label for="o_vend">Nombre del vendedor (aparece en el PDF)</label><input id="o_vend" autocomplete="name" maxlength="80" placeholder="Ej: Juan Pérez" value="${esc(st.vendedor)}">
            <span class="ayuda">Queda guardado en este equipo para las próximas cotizaciones.</span></div>
        </section>

        <section class="tarjeta seccion-form"><div class="tarjeta-titulo"><h2><span class="paso">1</span>Cliente</h2><span id="estadoRut" class="estado-rut"></span></div>
          <div class="rejilla rejilla-2">
            <div class="campo"><label for="c_rut">RUT</label><input id="c_rut" name="rut" placeholder="12.345.678-9" value="${esc(st.cliente.rut)}">
              <span class="ayuda">Si el cliente ya existe, sus datos se completan solos.</span></div>
            <div class="campo autocompletar"><label for="c_nombre">Nombre completo o razón social *</label><input id="c_nombre" name="nombre" required value="${esc(st.cliente.nombre)}" placeholder="Escriba para buscar clientes"></div>
            <div class="campo"><label for="c_tel">Teléfono / WhatsApp *</label><input id="c_tel" name="telefono" type="tel" inputmode="tel" placeholder="+56 9 1234 5678" value="${esc(st.cliente.whatsapp || st.cliente.telefono)}"></div>
            <div class="campo"><label for="c_email">Correo electrónico (opcional)</label><input id="c_email" name="email" type="email" inputmode="email" value="${esc(st.cliente.email || '')}"></div>
          </div>
        </section>

        <section class="tarjeta seccion-form"><div class="tarjeta-titulo"><h2><span class="paso">2</span>Vehículo</h2></div>
          <div class="rejilla rejilla-3">
            <div class="campo"><label for="v_marca">Marca</label><input id="v_marca" value="${esc(st.vehiculo.marca || '')}" placeholder="Ej: Toyota"></div>
            <div class="campo"><label for="v_modelo">Modelo</label><input id="v_modelo" value="${esc(st.vehiculo.modelo || '')}" placeholder="Ej: Yaris"></div>
            <div class="campo"><label for="v_anio">Año</label><input id="v_anio" inputmode="numeric" value="${esc(st.vehiculo.anio || '')}" placeholder="Ej: 2018"></div>
          </div>
        </section>

        <section class="tarjeta seccion-form"><div class="tarjeta-titulo"><h2><span class="paso">3</span>Repuestos</h2><span class="muted small">Busque por SKU o nombre</span></div>
          <div id="items"></div>
          <button type="button" class="btn btn-celeste btn-bloque" id="agregarItem" style="margin-top:.9rem">${icono('mas')} Añadir otro repuesto</button>
        </section>

        <section class="tarjeta seccion-form"><div class="tarjeta-titulo"><h2><span class="paso">4</span>Impuestos, descuentos y condiciones</h2></div>
          <div class="rejilla rejilla-2">
            <div>
              <label class="check"><input type="checkbox" id="o_coniva" ${st.precios_con_iva ? 'checked' : ''}> Los precios ingresados ya incluyen IVA</label>
              <label class="check"><input type="checkbox" id="o_aplica" ${st.aplica_iva ? 'checked' : ''}> Aplicar IVA 19 %</label>
              <div class="rejilla rejilla-2" style="margin-top:.6rem">
                <div class="campo"><label for="o_desc">Descuento global (%)</label><input id="o_desc" inputmode="decimal" value="${esc(st.descuento_global_pct || '')}" placeholder="0"></div>
                <div class="campo"><label for="o_vig">Vigencia (días)</label><input id="o_vig" inputmode="numeric" value="${esc(st.vigencia_dias)}"></div>
              </div>
            </div>
            <div class="totales-panel" id="totales"></div>
          </div>
          <div class="rejilla rejilla-2" style="margin-top:1rem">
            <div class="campo"><label for="o_cond">Condiciones comerciales (aparecen en el PDF)</label><textarea id="o_cond" placeholder="Ej: forma de pago, despacho, garantía…">${esc(st.condiciones)}</textarea></div>
            <div class="campo"><label for="o_obs">Observaciones para el cliente (aparecen en el PDF)</label><textarea id="o_obs">${esc(st.observaciones)}</textarea></div>
            <div class="campo col-2"><label for="o_int">Notas internas (solo visibles en el panel)</label><textarea id="o_int" style="min-height:70px">${esc(st.notas_internas)}</textarea></div>
          </div>
        </section>
      </form>
      <div class="barra-total"><div><div class="rotulo">Total cotización</div><div class="monto" id="totalBarra">$0</div></div>
        <button class="btn btn-celeste btn-grande" id="guardar">${icono('guardar')} ${idEditar ? 'Guardar cambios' : 'Guardar cotización'}</button></div>`;

    const form = $('#formCot', vista);
    const marcarSucio = () => (App.cambiosSinGuardar = true);
    form.addEventListener('input', marcarSucio);
    if (params.get('solicitud')) App.cambiosSinGuardar = true;

    /* ---- Cliente: RUT con autocompletado ---- */
    const estadoRut = $('#estadoRut', vista);
    const rellenarCliente = (c) => {
      $('#c_nombre').value = c.nombre || '';
      $('#c_tel').value = c.whatsapp || c.telefono || '';
      $('#c_email').value = c.email || '';
      if (c.rut) $('#c_rut').value = JJV.formatearRut(c.rut);
      $('#c_rut').classList.add('valido');
      estadoRut.className = 'estado-rut ok';
      estadoRut.textContent = '✓ Cliente registrado';
    };
    App.prepararRut($('#c_rut'), {
      alValidar: async (rut) => {
        if (rut === null) return (estadoRut.textContent = '');
        if (rut === false) {
          estadoRut.className = 'estado-rut mal';
          estadoRut.textContent = 'RUT no válido';
          return;
        }
        try {
          const c = await App.get(`/api/admin/clientes/rut/${encodeURIComponent(rut)}`);
          rellenarCliente(c);
        } catch (e) {
          estadoRut.className = 'estado-rut nuevo';
          estadoRut.textContent = 'Cliente nuevo: se registrará al guardar';
        }
      },
    });
    if (st.cliente.rut) $('#c_rut').dispatchEvent(new Event('blur'));
    App.autocompletar($('#c_nombre'), {
      buscar: async (q) => (await App.get(`/api/admin/clientes?q=${encodeURIComponent(q)}&limite=8`)).filas,
      render: App.renderCliente,
      elegir: (c) => {
        rellenarCliente(c);
        marcarSucio();
      },
    });

    /* ---- Repuestos ---- */
    const contItems = $('#items', vista);

    function htmlItem(it, i) {
      return `<div class="item" data-i="${i}">
        <div class="item-cabecera"><span class="item-numero">Repuesto ${i + 1}</span>
          <button type="button" class="btn btn-texto btn-icono btn-peligro" data-quitar="${i}" aria-label="Quitar repuesto" ${st.items.length === 1 ? 'hidden' : ''}>${icono('basura')}</button></div>
        <div class="item-grid">
          <div class="campo autocompletar"><label>SKU</label><input data-campo="sku" value="${esc(it.sku)}" placeholder="SKU"></div>
          <div class="campo autocompletar ancho"><label>Nombre del repuesto *</label><input data-campo="nombre" value="${esc(it.nombre)}" placeholder="Buscar por nombre"></div>
          <div class="campo"><label>Código OEM</label><input data-campo="oem" value="${esc(it.oem)}" placeholder="Opcional"></div>
          <div class="campo"><label>Cant.</label><input data-campo="cantidad" inputmode="decimal" value="${esc(it.cantidad)}"></div>
          <div class="campo"><label>Precio unit.</label><input data-campo="precio_unitario" inputmode="numeric" value="${it.precio_unitario ? esc(JJV.clp(it.precio_unitario).slice(1)) : ''}" placeholder="0"></div>
          <div class="campo"><label>Desc. %</label><input data-campo="descuento_pct" inputmode="decimal" value="${it.descuento_pct ? esc(it.descuento_pct) : ''}" placeholder="0"></div>
          <div class="campo"><label>Subtotal</label><div class="subtotal-item" data-subtotal>$0</div></div>
          <div class="info-catalogo" data-info></div>
        </div></div>`;
    }

    function pintarInfo(i) {
      const it = st.items[i];
      const el = $(`.item[data-i="${i}"] [data-info]`, contItems);
      if (!el) return;
      if (it.producto) {
        const p = it.producto;
        el.innerHTML = `<span class="etiqueta-cat en">${icono('check').replace('<svg', '<svg width="12" height="12"')} En catálogo</span>
          ${p.stock != null ? `<span>Stock: <strong>${esc(p.stock)}</strong></span>` : ''}
          ${p.marca ? `<span>Compatible: ${esc([p.marca, p.modelo, p.anio].filter(Boolean).join(' '))}</span>` : ''}
          ${p.precio !== it.precio_unitario ? `<span>Precio catálogo: ${clp(p.precio)}</span>` : ''}`;
      } else if (it.sku) {
        el.innerHTML = `<span class="etiqueta-cat fuera">No está en el catálogo</span>
          <label class="check" style="min-height:0"><input type="checkbox" data-campo="guardar_en_catalogo" ${it.guardar_en_catalogo ? 'checked' : ''}> Guardarlo en el catálogo</label>`;
      } else {
        el.innerHTML = it.nombre ? '<span>Repuesto ingresado manualmente (agregue un SKU para guardarlo en el catálogo).</span>' : '';
      }
    }

    function pintarItems() {
      contItems.innerHTML = st.items.map(htmlItem).join('');
      st.items.forEach((_, i) => {
        prepararItem(i);
        pintarInfo(i);
      });
      recalcular();
    }

    function aplicarProducto(i, p) {
      const it = st.items[i];
      Object.assign(it, { producto_id: p.id, producto: p, sku: p.sku, nombre: p.nombre, oem: p.oem || '', precio_unitario: p.precio });
      const fila = $(`.item[data-i="${i}"]`, contItems);
      $('[data-campo="sku"]', fila).value = p.sku;
      $('[data-campo="nombre"]', fila).value = p.nombre;
      $('[data-campo="oem"]', fila).value = p.oem || '';
      $('[data-campo="precio_unitario"]', fila).value = JJV.clp(p.precio).slice(1);
      if (!$('#v_marca').value && p.marca) $('#v_marca').value = p.marca;
      pintarInfo(i);
      recalcular();
      marcarSucio();
      const cant = $('[data-campo="cantidad"]', fila);
      if (window.innerWidth > 720) cant.select();
    }

    function prepararItem(i) {
      const fila = $(`.item[data-i="${i}"]`, contItems);
      const buscar = async (q) => (await App.get(`/api/admin/productos?q=${encodeURIComponent(q)}&limite=8`)).filas;
      App.autocompletar($('[data-campo="sku"]', fila), { buscar, render: App.renderProducto, elegir: (p) => aplicarProducto(i, p), min: 1 });
      App.autocompletar($('[data-campo="nombre"]', fila), { buscar, render: App.renderProducto, elegir: (p) => aplicarProducto(i, p) });
      // Autocompletado exacto por SKU al salir del campo
      $('[data-campo="sku"]', fila).addEventListener('change', async (e) => {
        const sku = e.target.value.trim();
        const it = st.items[i];
        if (!sku) {
          it.producto = null;
          it.producto_id = null;
          return pintarInfo(i);
        }
        if (it.producto && it.producto.sku.toLowerCase() === sku.toLowerCase()) return;
        try {
          const p = await App.get(`/api/admin/productos/sku/${encodeURIComponent(sku)}`);
          aplicarProducto(i, p);
        } catch {
          it.producto = null;
          it.producto_id = null;
          pintarInfo(i);
        }
      });
      // Formatea el precio con separador de miles
      $('[data-campo="precio_unitario"]', fila).addEventListener('blur', (e) => {
        const n = JJV.entero(e.target.value);
        e.target.value = n ? JJV.clp(n).slice(1) : '';
      });
    }

    contItems.addEventListener('input', (e) => {
      const campo = e.target.dataset.campo;
      const fila = e.target.closest('.item');
      if (!campo || !fila) return;
      const i = Number(fila.dataset.i);
      const it = st.items[i];
      if (campo === 'guardar_en_catalogo') it.guardar_en_catalogo = e.target.checked;
      else if (campo === 'precio_unitario') it.precio_unitario = JJV.entero(e.target.value);
      else it[campo] = e.target.value;
      if (campo === 'sku' && it.producto && it.producto.sku.toLowerCase() !== e.target.value.trim().toLowerCase()) {
        it.producto = null;
        it.producto_id = null;
        pintarInfo(i);
      }
      if (campo === 'nombre' && !it.sku) pintarInfo(i);
      recalcular();
    });
    contItems.addEventListener('click', (e) => {
      const b = e.target.closest('[data-quitar]');
      if (!b) return;
      st.items.splice(Number(b.dataset.quitar), 1);
      pintarItems();
      marcarSucio();
    });
    $('#agregarItem', vista).addEventListener('click', () => {
      st.items.push(normalizarItem({}));
      pintarItems();
      const nuevo = $$('.item', contItems).pop();
      nuevo.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(() => $('[data-campo="sku"]', nuevo).focus(), 300);
    });

    /* ---- Totales ---- */
    const leerOpciones = () => ({
      preciosConIva: $('#o_coniva').checked,
      aplicaIva: $('#o_aplica').checked,
      descuentoGlobalPct: $('#o_desc').value,
    });
    function recalcular() {
      const r = JJV.calcularCotizacion(st.items, leerOpciones());
      $$('.item', contItems).forEach((fila, i) => ($('[data-subtotal]', fila).textContent = clp(r.lineas[i].subtotal)));
      const ivaNota = !r.aplicaIva ? 'Sin IVA' : r.preciosConIva ? 'IVA incluido en los precios' : 'IVA agregado a precios netos';
      $('#totales').innerHTML = `
        <div class="linea"><span>Subtotal</span><span>${clp(r.sumaBruta)}</span></div>
        ${r.descuentoTotal ? `<div class="linea"><span>Descuentos</span><span>-${clp(r.descuentoTotal)}</span></div>` : ''}
        ${r.aplicaIva ? `<div class="linea"><span>Neto</span><span>${clp(r.neto)}</span></div><div class="linea"><span>IVA (19 %)</span><span>${clp(r.iva)}</span></div>` : ''}
        <div class="linea total"><span>Total</span><span>${clp(r.total)}</span></div>
        <div class="muted small" style="text-align:right">${ivaNota}</div>`;
      $('#totalBarra').textContent = clp(r.total);
      $('#o_coniva').disabled = !r.aplicaIva;
    }
    ['#o_coniva', '#o_aplica', '#o_desc'].forEach((s) => $(s).addEventListener('input', recalcular));

    pintarItems();

    /* ---- Guardar ---- */
    $('#guardar').addEventListener('click', async () => {
      const errores = [];
      const rutTxt = $('#c_rut').value.trim();
      if (rutTxt && !JJV.validarRut(rutTxt)) errores.push('El RUT no es válido.');
      if (!$('#c_nombre').value.trim()) errores.push('Ingrese el nombre del cliente.');
      const tel = $('#c_tel').value.trim();
      if (!JJV.validarTelefono(tel)) errores.push('Ingrese un teléfono válido del cliente.');
      const email = $('#c_email').value.trim();
      if (email && !JJV.validarEmail(email)) errores.push('El correo no es válido.');
      const items = st.items.filter((it) => it.nombre.trim() || it.sku.trim() || it.precio_unitario);
      if (!items.length) errores.push('Agregue al menos un repuesto.');
      items.forEach((it, i) => {
        if (!it.nombre.trim()) errores.push(`Repuesto ${i + 1}: falta el nombre.`);
        if (!(Number(String(it.cantidad).replace(',', '.')) > 0)) errores.push(`Repuesto ${i + 1}: cantidad no válida.`);
      });
      const contErr = $('#errores', vista);
      if (errores.length) {
        contErr.innerHTML = `<div class="alerta alerta-error" style="margin-bottom:1rem">${errores.map(esc).join('<br>')}</div>`;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      contErr.innerHTML = '';
      const cuerpo = {
        cliente: { rut: rutTxt, nombre: $('#c_nombre').value, telefono: tel, whatsapp: tel, email },
        vehiculo: { marca: $('#v_marca').value, modelo: $('#v_modelo').value, anio: $('#v_anio').value },
        items: items.map((it) => ({
          producto_id: it.producto_id,
          sku: it.sku,
          nombre: it.nombre,
          oem: it.oem,
          cantidad: it.cantidad,
          precio_unitario: it.precio_unitario,
          descuento_pct: it.descuento_pct,
          guardar_en_catalogo: it.guardar_en_catalogo,
        })),
        precios_con_iva: $('#o_coniva').checked,
        aplica_iva: $('#o_aplica').checked,
        descuento_global_pct: $('#o_desc').value,
        vigencia_dias: $('#o_vig').value,
        condiciones: $('#o_cond').value,
        observaciones: $('#o_obs').value,
        notas_internas: $('#o_int').value,
        vendedor: $('#o_vend').value.trim(),
        solicitud_id: st.solicitud_id,
      };
      try { localStorage.setItem('jjv-vendedor', cuerpo.vendedor); } catch (e) {}
      if (cuerpo.vendedor && window.Demo.nube && window.Demo.nube.activa) window.Demo.nube.usuario.nombre = cuerpo.vendedor;
      const boton = $('#guardar');
      boton.disabled = true;
      try {
        const c = idEditar ? await App.put(`/api/admin/cotizaciones/${idEditar}`, cuerpo) : await App.post('/api/admin/cotizaciones', cuerpo);
        App.cambiosSinGuardar = false;
        App.toast(idEditar ? 'Cambios guardados' : `Cotización ${c.numero} creada`, 'ok');
        if (st.solicitud_id) App.actualizarPendientes();
        location.hash = `#/cotizaciones/${c.id}`;
      } catch (e) {
        contErr.innerHTML = `<div class="alerta alerta-error" style="margin-bottom:1rem">${esc(e.message)}</div>`;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } finally {
        boton.disabled = false;
      }
    });
  };

  function normalizarItem(it) {
    return {
      producto_id: it.producto_id || null,
      producto: null,
      sku: it.sku || '',
      nombre: it.nombre || '',
      oem: it.oem || '',
      cantidad: it.cantidad ?? 1,
      precio_unitario: JJV.entero(it.precio_unitario),
      descuento_pct: it.descuento_pct || 0,
      guardar_en_catalogo: true,
    };
  }

  /* ================================ WHATSAPP ================================ */
  async function obtenerArchivoPdf(c) {
    const r = await fetch(`/api/admin/cotizaciones/${c.id}/pdf`, { credentials: 'same-origin' });
    if (!r.ok) throw new Error('No se pudo generar el PDF.');
    const blob = await r.blob();
    return new File([blob], `Cotizacion-${c.numero}.pdf`, { type: 'application/pdf' });
  }

  async function compartirPdf(c, texto) {
    try {
      const archivo = await obtenerArchivoPdf(c);
      const datos = { files: [archivo], title: `Cotización ${c.numero}`, text: texto || `Cotización ${c.numero}` };
      if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
        await navigator.share(datos);
      } else if (navigator.share) {
        await navigator.share({ title: datos.title, text: texto || datos.text, url: c.enlace });
      } else {
        App.copiar(c.enlace, 'Este dispositivo no permite compartir archivos. Se copió el enlace de descarga.');
        return false;
      }
      await App.post(`/api/admin/cotizaciones/${c.id}/enviada`, { medio: 'Compartir del dispositivo' });
      return true;
    } catch (e) {
      if (e.name !== 'AbortError') App.error(e);
      return false;
    }
  }

  async function abrirWhatsapp(c) {
    let datos;
    try {
      datos = await App.get(`/api/admin/cotizaciones/${c.id}/whatsapp`);
    } catch (e) {
      return App.error(e);
    }
    const puedeArchivo = !!(navigator.canShare && navigator.share);
    App.modal(
      `${App.cabeceraModal('Enviar por WhatsApp')}
      <div class="rejilla">
        <div class="campo"><label for="waTel">Número del cliente (con código de país)</label><input id="waTel" type="tel" inputmode="tel" value="${esc(datos.telefono)}" placeholder="56912345678"></div>
        <div class="campo"><label for="waMsg">Mensaje (puede editarlo antes de enviar)</label><textarea id="waMsg" class="wa-texto">${esc(datos.mensaje)}</textarea></div>
        <label class="check"><input type="checkbox" id="waMarcar" ${c.estado === 'Pendiente' ? 'checked' : ''}> Marcar la cotización como <strong>Enviada</strong></label>
        <div class="alerta alerta-info small">${
          datos.enlace
            ? `WhatsApp no permite adjuntar el PDF automáticamente desde un enlace. El mensaje incluye un enlace seguro para que el cliente vea y descargue el PDF.${puedeArchivo ? ' Desde el celular también puede usar «Compartir PDF» para enviar el archivo directamente.' : ''}`
            : 'WhatsApp no permite adjuntar archivos automáticamente. Envíe el mensaje y luego adjunte el PDF: use «Descargar PDF» y compártalo en el mismo chat.'
        }</div>
      </div>
      <div class="modal-pie">
        <button class="btn" data-copiar>${icono('duplicar')} Copiar mensaje</button>
        ${puedeArchivo ? `<button class="btn" data-archivo>${icono('compartir')} Compartir PDF</button>` : ''}
        <button class="btn btn-wa" data-abrir>${icono('whatsapp')} Abrir WhatsApp</button>
      </div>`,
      {
        alMontar: (el, cerrar) => {
          const msg = () => $('#waMsg', el).value;
          $('[data-copiar]', el).addEventListener('click', () => App.copiar(msg(), 'Mensaje copiado'));
          const archivo = $('[data-archivo]', el);
          if (archivo) archivo.addEventListener('click', async () => (await compartirPdf(c, msg())) && (cerrar(), App.ir(`#/cotizaciones/${c.id}`)));
          $('[data-abrir]', el).addEventListener('click', () => {
            const tel = JJV.telefonoWhatsapp($('#waTel', el).value);
            if (!tel || tel.length < 10) return App.toast('Ingrese un número de WhatsApp válido.', 'error');
            window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg())}`, '_blank', 'noopener');
            App.post(`/api/admin/cotizaciones/${c.id}/enviada`, { medio: 'WhatsApp', marcar: $('#waMarcar', el).checked })
              .then(() => {
                cerrar();
                App.ir(`#/cotizaciones/${c.id}`);
              })
              .catch(App.error);
          });
        },
      }
    );
  }

  /* ================================ HISTORIAL ================================ */
  App.vistas.historial = async function (vista) {
    const p = App.params();
    const f = { q: p.get('q') || '', estado: p.get('estado') || '', desde: p.get('desde') || '', hasta: p.get('hasta') || '', pagina: Number(p.get('pagina')) || 1 };
    vista.innerHTML = `
      <div class="cabecera-vista"><div><h1>Historial de cotizaciones</h1><p class="muted">Busque por cliente, RUT, teléfono, SKU, repuesto, número o fecha (dd-mm-aaaa).</p></div>
        <div class="botonera"><a class="btn" id="exportar" href="#">${icono('descargar')} Exportar a Excel (CSV)</a>
        <a class="btn btn-primario" href="#/cotizaciones/nueva">${icono('mas')} Nueva</a></div></div>
      <div class="filtros-chips">${['', 'Pendiente', 'Enviada', 'Aprobada', 'Rechazada', 'Vencida']
        .map((e) => `<button class="chip ${f.estado === e ? 'activo' : ''}" data-estado="${e}">${e || 'Todas'}</button>`)
        .join('')}</div>
      <div class="buscador">
        <div class="campo-busqueda">${icono('buscar')}<input id="q" type="search" placeholder="Buscar…" value="${esc(f.q)}" aria-label="Buscar"></div>
        <input type="date" id="desde" value="${esc(f.desde)}" aria-label="Desde"><input type="date" id="hasta" value="${esc(f.hasta)}" aria-label="Hasta">
      </div>
      <div id="resultados"><div class="cargando"><div class="spinner"></div></div></div>`;

    const cargar = async () => {
      const qs = new URLSearchParams(Object.entries(f).filter(([, v]) => v)).toString();
      history.replaceState(null, '', `#/historial${qs ? '?' + qs : ''}`);
      $('#exportar').href = `/api/admin/exportar/cotizaciones.csv?${qs}`;
      const r = await App.get(`/api/admin/cotizaciones?${qs}&limite=30`);
      const paginas = Math.ceil(r.total / r.limite) || 1;
      $('#resultados').innerHTML = !r.filas.length
        ? vacio('No se encontraron cotizaciones con esos filtros.')
        : `<p class="muted small">${r.total} cotización(es)</p>
        <div class="tabla-envoltura solo-escritorio"><table class="tabla"><thead><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>Repuestos</th><th>Estado</th><th class="num">Total</th></tr></thead>
        <tbody>${r.filas
          .map(
            (c) => `<tr data-ir="#/cotizaciones/${c.id}"><td><strong>${esc(c.numero)}</strong></td><td>${fecha(c.fecha)}</td>
            <td>${esc(c.cliente_nombre)}<div class="muted small">${c.cliente_rut ? esc(JJV.formatearRut(c.cliente_rut)) : esc(c.cliente_telefono || '')}</div></td>
            <td class="small" style="max-width:280px">${esc(c.resumen || '')}${c.n_items > 3 ? ` <span class="muted">+${c.n_items - 3}</span>` : ''}</td>
            <td>${badge(c.estado)}</td><td class="num"><strong>${clp(c.total)}</strong></td></tr>`
          )
          .join('')}</tbody></table></div>
        <div class="lista solo-movil">${r.filas.map(filaCotizacion).join('')}</div>
        ${paginas > 1 ? `<div class="paginacion"><button class="btn" data-pag="${f.pagina - 1}" ${f.pagina <= 1 ? 'disabled' : ''}>Anterior</button><span>Página ${f.pagina} de ${paginas}</span><button class="btn" data-pag="${f.pagina + 1}" ${f.pagina >= paginas ? 'disabled' : ''}>Siguiente</button></div>` : ''}`;
    };
    const recargar = App.debounce(() => {
      f.pagina = 1;
      cargar().catch(App.error);
    }, 300);
    $('#q').addEventListener('input', (e) => {
      f.q = e.target.value.trim();
      recargar();
    });
    $('#desde').addEventListener('change', (e) => {
      f.desde = e.target.value;
      recargar();
    });
    $('#hasta').addEventListener('change', (e) => {
      f.hasta = e.target.value;
      recargar();
    });
    vista.addEventListener('click', (e) => {
      const chip = e.target.closest('[data-estado]');
      const fila = e.target.closest('[data-ir]');
      const pag = e.target.closest('[data-pag]');
      if (chip) {
        f.estado = chip.dataset.estado;
        $$('.chip', vista).forEach((c) => c.classList.toggle('activo', c === chip));
        recargar();
      } else if (fila) location.hash = fila.dataset.ir;
      else if (pag) {
        f.pagina = Number(pag.dataset.pag);
        cargar().catch(App.error);
        window.scrollTo(0, 0);
      }
    });
    await cargar();
  };
})();

</script>
<script>
/* AUTOMOTRIZ JJV — Vistas: solicitudes, catálogo, clientes y configuración. */
(function () {
  'use strict';
  const App = window.App;
  const { esc, $, $$, clp, fecha, fechaHora, badge, icono } = App;

  /** Lee los campos con atributo name de un contenedor. */
  const leerFormulario = (el) => {
    const o = {};
    $$('[name]', el).forEach((i) => (o[i.name] = i.type === 'checkbox' ? (i.checked ? '1' : '0') : i.value));
    return o;
  };

  /* ================================ SOLICITUDES ================================ */
  App.vistas.solicitudes = async function (vista) {
    const p = App.params();
    const f = { q: p.get('q') || '', estado: p.has('estado') ? p.get('estado') : 'Pendiente' };
    const urlPublica = `${location.origin}/solicitar`;
    vista.innerHTML = `
      <div class="cabecera-vista"><div><h1>Solicitudes de clientes</h1><p class="muted">Pedidos recibidos desde el formulario público. Conviértalos en cotización con un toque.</p></div>
        <a class="btn" href="/api/admin/exportar/solicitudes.csv">${icono('descargar')} Exportar CSV</a></div>
      <div class="alerta alerta-info small" style="margin-bottom:1rem">Formulario público para sus clientes: <a href="${esc(urlPublica)}" target="_blank" rel="noopener">${esc(urlPublica)}</a>
        <button class="btn btn-texto" data-copiar style="min-height:30px;padding:0 .4rem">Copiar</button></div>
      <div class="filtros-chips">${['Pendiente', 'Cotizada', 'Descartada', '']
        .map((e) => `<button class="chip ${f.estado === e ? 'activo' : ''}" data-estado="${e}">${e ? e + 's' : 'Todas'}</button>`)
        .join('')}</div>
      <div class="buscador"><div class="campo-busqueda">${icono('buscar')}<input id="q" type="search" placeholder="Buscar por nombre, RUT, teléfono, repuesto, vehículo…" value="${esc(f.q)}"></div></div>
      <div id="resultados"></div>`;
    const cargar = async () => {
      const qs = new URLSearchParams({ q: f.q, estado: f.estado }).toString();
      const r = await App.get(`/api/admin/solicitudes?${qs}`);
      $('#resultados').innerHTML = !r.filas.length
        ? App.vacio('No hay solicitudes en esta vista.')
        : `<div class="lista">${r.filas
            .map(
              (s) => `<a class="fila-tarjeta" href="#/solicitudes/${s.id}">
          <div class="linea"><span class="titulo">${esc(s.nombre)}</span>${badge(s.estado)}</div>
          <div class="linea"><span class="sub"><strong>${esc(s.repuesto)}</strong> × ${esc(s.cantidad)} · ${esc([s.marca, s.modelo, s.anio].filter(Boolean).join(' '))}</span>
          <span class="muted small">${esc(s.numero)}</span></div>
          <div class="sub">${fechaHora(s.creado)} · ${esc(s.telefono)}${s.foto ? ' · 📷 con foto' : ''}</div></a>`
            )
            .join('')}</div>`;
    };
    const recargar = App.debounce(() => cargar().catch(App.error), 300);
    $('#q').addEventListener('input', (e) => {
      f.q = e.target.value.trim();
      recargar();
    });
    vista.addEventListener('click', (e) => {
      const chip = e.target.closest('[data-estado]');
      if (chip) {
        f.estado = chip.dataset.estado;
        $$('.chip', vista).forEach((c) => c.classList.toggle('activo', c === chip));
        recargar();
      }
      if (e.target.closest('[data-copiar]')) App.copiar(urlPublica, 'Enlace del formulario copiado');
    });
    await cargar();
  };

  App.vistas.detalleSolicitud = async function (vista, id) {
    const s = await App.get(`/api/admin/solicitudes/${id}`);
    const tel = JJV.telefonoWhatsapp(s.telefono);
    vista.innerHTML = `
      <div class="cabecera-vista"><a class="btn" href="#/solicitudes">${icono('flecha')} Solicitudes</a></div>
      <section class="tarjeta">
        <div class="detalle-cabecera"><div><div class="numero">${esc(s.numero)}</div><div class="muted">Recibida ${fechaHora(s.creado)}</div></div>${badge(s.estado)}</div>
        <div class="acciones-principales">
          ${
            s.cotizacion
              ? `<a class="btn btn-primario btn-grande" href="#/cotizaciones/${s.cotizacion.id}">${icono('documento')} Ver cotización ${esc(s.cotizacion.numero)}</a>`
              : `<a class="btn btn-primario btn-grande" href="#/cotizaciones/nueva?solicitud=${s.id}">${icono('documento')} Convertir en cotización</a>`
          }
          ${tel ? `<a class="btn btn-wa btn-grande" href="https://wa.me/${tel}?text=${encodeURIComponent(`Hola ${s.nombre.split(' ')[0]}, le escribimos de ${App.estado.empresa.nombre} por su solicitud ${s.numero}.`)}" target="_blank" rel="noopener">${icono('whatsapp')} Escribir por WhatsApp</a>` : ''}
          ${s.estado === 'Descartada' ? `<button class="btn btn-grande" data-estado="Pendiente">Reabrir</button>` : s.estado === 'Pendiente' ? `<button class="btn btn-grande" data-estado="Descartada">Descartar</button>` : ''}
        </div>
      </section>
      <div class="dos-columnas" style="margin-top:1rem">
        <section class="tarjeta"><h2>Cliente</h2>
          <dl class="datos-lista"><dt>Nombre</dt><dd>${esc(s.nombre)}</dd><dt>RUT</dt><dd>${s.rut ? esc(JJV.formatearRut(s.rut)) : '—'}</dd>
          <dt>Teléfono</dt><dd>${esc(s.telefono)}</dd><dt>Correo</dt><dd>${esc(s.email || '—')}</dd>
          <dt>Registro</dt><dd>${s.cliente_registrado ? `<a href="#/clientes/${s.cliente_registrado.id}">Cliente registrado</a>` : 'Cliente nuevo (se registra al cotizar)'}</dd></dl>
        </section>
        <section class="tarjeta"><h2>Repuesto solicitado</h2>
          <dl class="datos-lista"><dt>Repuesto</dt><dd>${esc(s.repuesto)}</dd><dt>Cantidad</dt><dd>${esc(s.cantidad)}</dd>
          <dt>SKU / OEM</dt><dd>${esc(s.sku_oem || '—')}</dd><dt>Vehículo</dt><dd>${esc([s.marca, s.modelo, s.anio].filter(Boolean).join(' '))}</dd>
          <dt>Observaciones</dt><dd class="pre">${esc(s.observaciones || '—')}</dd></dl>
          ${s.foto ? `<p style="margin-top:.8rem"><a href="/api/admin/archivos/${esc(s.foto)}" target="_blank" rel="noopener"><img class="foto-grande" src="/api/admin/archivos/${esc(s.foto)}" alt="Foto enviada por el cliente"></a></p>` : ''}
        </section>
      </div>
      <section class="tarjeta" style="margin-top:1rem"><h2>Notas internas</h2>
        <textarea id="notas" placeholder="Solo visibles para el equipo">${esc(s.notas_internas || '')}</textarea>
        <div class="botonera" style="margin-top:.6rem;justify-content:space-between"><button class="btn" data-guardar-notas>${icono('guardar')} Guardar notas</button>
        <button class="btn btn-texto btn-peligro" data-eliminar>${icono('basura')} Eliminar solicitud</button></div>
      </section>`;
    vista.addEventListener('click', async (e) => {
      try {
        const est = e.target.closest('[data-estado]')?.dataset.estado;
        if (est) {
          await App.put(`/api/admin/solicitudes/${id}`, { estado: est });
          App.toast(`Solicitud ${est === 'Descartada' ? 'descartada' : 'reabierta'}`, 'ok');
          App.actualizarPendientes();
          App.ir(`#/solicitudes/${id}`);
        } else if (e.target.closest('[data-guardar-notas]')) {
          await App.put(`/api/admin/solicitudes/${id}`, { notas_internas: $('#notas').value });
          App.toast('Notas guardadas', 'ok');
        } else if (e.target.closest('[data-eliminar]')) {
          if (!(await App.confirmar('Se eliminará la solicitud y su foto. Esta acción no se puede deshacer.', { boton: 'Eliminar', peligro: true }))) return;
          await App.del(`/api/admin/solicitudes/${id}`);
          App.toast('Solicitud eliminada', 'ok');
          App.actualizarPendientes();
          location.hash = '#/solicitudes';
        }
      } catch (err) {
        App.error(err);
      }
    });
  };

  /* ================================ CATÁLOGO ================================ */
  App.vistas.catalogo = async function (vista) {
    const f = { q: App.params().get('q') || '' };
    vista.innerHTML = `
      <div class="cabecera-vista"><div><h1>Catálogo de repuestos</h1><p class="muted" id="totalProd"></p></div>
        <div class="botonera"><button class="btn btn-primario" data-nuevo>${icono('mas')} Nuevo repuesto</button>
        <button class="btn" data-importar>${icono('subir')} Importar ${App.importaExcel ? 'CSV / Excel' : 'CSV'}</button>
        <button class="btn" data-ajuste>Actualizar precios</button>
        <a class="btn" href="/api/admin/exportar/productos.csv">${icono('descargar')} Exportar</a></div></div>
      <div class="buscador"><div class="campo-busqueda">${icono('buscar')}<input id="q" type="search" placeholder="Buscar por SKU, nombre, OEM, marca o modelo…" value="${esc(f.q)}"></div></div>
      <div id="resultados"></div>`;

    let filas = [];
    const cargar = async () => {
      const r = await App.get(`/api/admin/productos?q=${encodeURIComponent(f.q)}`);
      filas = r.filas;
      $('#totalProd').textContent = `${r.total.toLocaleString('es-CL')} repuesto(s) registrados. Edite precio y stock directamente en la tabla.${
        !f.q && filas.length < r.total ? ` Se muestran los primeros ${filas.length} por nombre; use el buscador para encontrar el resto.` : ''
      }`;
      $('#resultados').innerHTML = !filas.length
        ? App.vacio(f.q ? 'No hay repuestos que coincidan.' : 'El catálogo está vacío. Agregue repuestos uno a uno, impórtelos desde CSV o guárdelos al cotizar.')
        : `<div class="tabla-envoltura solo-escritorio"><table class="tabla"><thead><tr><th></th><th>SKU</th><th>Repuesto</th><th>OEM</th><th>Compatibilidad</th><th class="num">Precio</th><th class="num">Stock</th><th></th></tr></thead>
          <tbody>${filas
            .map(
              (p, i) => `<tr data-i="${i}"><td>${p.foto ? `<img class="miniatura" src="/api/admin/archivos/${esc(p.foto)}" alt="" loading="lazy">` : '<span class="miniatura"></span>'}</td>
            <td><strong>${esc(p.sku)}</strong></td><td>${esc(p.nombre)}</td><td>${esc(p.oem || '')}</td>
            <td class="small">${esc([p.marca, p.modelo, p.anio].filter(Boolean).join(' '))}</td>
            <td class="num"><input class="en-linea" data-precio="${p.id}" inputmode="numeric" value="${esc(JJV.clp(p.precio).slice(1))}" aria-label="Precio"></td>
            <td class="num"><input class="en-linea" style="width:70px" data-stock="${p.id}" inputmode="numeric" value="${p.stock ?? ''}" aria-label="Stock"></td>
            <td class="acciones-fila"><button class="btn btn-texto btn-icono" data-editar="${i}" aria-label="Editar">${icono('editar')}</button></td></tr>`
            )
            .join('')}</tbody></table></div>
          <div class="lista solo-movil">${filas
            .map(
              (p, i) => `<a class="fila-tarjeta" href="#" data-editar="${i}"><div class="linea" style="justify-content:flex-start">
            ${p.foto ? `<img class="miniatura" src="/api/admin/archivos/${esc(p.foto)}" alt="" loading="lazy">` : ''}
            <div style="flex:1;min-width:0"><div class="linea"><span class="titulo">${esc(p.nombre)}</span><span class="monto">${clp(p.precio)}</span></div>
            <div class="sub">SKU ${esc(p.sku)}${p.oem ? ' · OEM ' + esc(p.oem) : ''} · Stock ${esc(p.stock ?? '—')}</div>
            <div class="sub">${esc([p.marca, p.modelo, p.anio].filter(Boolean).join(' '))}</div></div></div></a>`
            )
            .join('')}</div>`;
    };

    const recargar = App.debounce(() => cargar().catch(App.error), 300);
    $('#q').addEventListener('input', (e) => {
      f.q = e.target.value.trim();
      recargar();
    });
    vista.addEventListener('change', async (e) => {
      const idPrecio = e.target.dataset.precio;
      const idStock = e.target.dataset.stock;
      try {
        if (idPrecio) {
          const precio = JJV.entero(e.target.value);
          await App.patch(`/api/admin/productos/${idPrecio}`, { precio });
          e.target.value = JJV.clp(precio).slice(1);
          App.toast('Precio actualizado', 'ok');
        } else if (idStock) {
          await App.patch(`/api/admin/productos/${idStock}`, { stock: e.target.value.trim() });
          App.toast('Stock actualizado', 'ok');
        }
      } catch (err) {
        App.error(err);
      }
    });
    vista.addEventListener('click', (e) => {
      const ed = e.target.closest('[data-editar]');
      if (ed) {
        e.preventDefault();
        return modalProducto(filas[Number(ed.dataset.editar)], cargar);
      }
      if (e.target.closest('tr[data-i]') && !e.target.closest('input')) return modalProducto(filas[Number(e.target.closest('tr').dataset.i)], cargar);
      if (e.target.closest('[data-nuevo]')) modalProducto(null, cargar);
      if (e.target.closest('[data-importar]')) modalImportar(cargar);
      if (e.target.closest('[data-ajuste]')) modalAjuste(cargar);
    });
    await cargar();
  };

  function modalProducto(p, alGuardar) {
    const v = p || {};
    App.modal(
      `${App.cabeceraModal(p ? 'Editar repuesto' : 'Nuevo repuesto')}
      <form id="formProd" class="rejilla rejilla-2" novalidate>
        <div class="campo"><label>SKU interno *</label><input name="sku" required value="${esc(v.sku || '')}"></div>
        <div class="campo"><label>Código OEM</label><input name="oem" value="${esc(v.oem || '')}"></div>
        <div class="campo col-2"><label>Nombre del repuesto *</label><input name="nombre" required value="${esc(v.nombre || '')}"></div>
        <div class="campo"><label>Marca del vehículo</label><input name="marca" value="${esc(v.marca || '')}"></div>
        <div class="campo"><label>Modelo</label><input name="modelo" value="${esc(v.modelo || '')}"></div>
        <div class="campo"><label>Año o rango compatible</label><input name="anio" value="${esc(v.anio || '')}" placeholder="Ej: 2015-2019"></div>
        <div class="campo"><label>Precio de venta (CLP) *</label><input name="precio" inputmode="numeric" value="${v.precio != null ? esc(JJV.clp(v.precio).slice(1)) : ''}"></div>
        <div class="campo"><label>Stock disponible</label><input name="stock" inputmode="numeric" value="${v.stock ?? ''}"></div>
        <div class="campo"><label>Fotografía</label><input type="file" name="foto_archivo" accept="image/jpeg,image/png,image/webp">
          ${v.foto ? `<div class="vista-foto" style="margin-top:.4rem"><img src="/api/admin/archivos/${esc(v.foto)}" alt=""><label class="check"><input type="checkbox" name="quitar_foto"> Quitar foto</label></div>` : ''}</div>
        <div class="campo col-2"><label>Descripción</label><textarea name="descripcion">${esc(v.descripcion || '')}</textarea></div>
        <div class="campo col-2"><label>Observaciones</label><textarea name="observaciones" style="min-height:60px">${esc(v.observaciones || '')}</textarea></div>
      </form>
      <div class="modal-pie">${p ? `<button class="btn btn-peligro" data-borrar style="margin-right:auto">${icono('basura')} Eliminar</button>` : ''}
        <button class="btn" data-cerrar>Cancelar</button><button class="btn btn-primario" data-ok>${icono('guardar')} Guardar</button></div>`,
      {
        alMontar: (el, cerrar) => {
          $('[data-ok]', el).addEventListener('click', async () => {
            const fd = new FormData();
            const datos = leerFormulario($('#formProd', el));
            for (const [k, val] of Object.entries(datos)) if (k !== 'foto_archivo') fd.append(k, val);
            const archivo = $('[name="foto_archivo"]', el).files[0];
            if (archivo) fd.append('foto', archivo);
            if (!datos.sku.trim() || !datos.nombre.trim()) return App.toast('SKU y nombre son obligatorios.', 'error');
            try {
              await App.api(p ? 'PUT' : 'POST', p ? `/api/admin/productos/${p.id}` : '/api/admin/productos', fd, { formulario: true });
              cerrar();
              App.toast('Repuesto guardado', 'ok');
              alGuardar();
            } catch (e) {
              App.error(e);
            }
          });
          const borrar = $('[data-borrar]', el);
          if (borrar)
            borrar.addEventListener('click', async () => {
              cerrar();
              if (!(await App.confirmar(`¿Eliminar "${p.nombre}" del catálogo? Las cotizaciones existentes no se modifican.`, { boton: 'Eliminar', peligro: true }))) return;
              try {
                await App.del(`/api/admin/productos/${p.id}`);
                App.toast('Repuesto eliminado', 'ok');
                alGuardar();
              } catch (e) {
                App.error(e);
              }
            });
        },
      }
    );
  }

  function modalImportar(alTerminar) {
    App.modal(
      `${App.cabeceraModal(App.importaExcel ? 'Importar repuestos (CSV o Excel)' : 'Importar repuestos desde CSV')}
      <p class="small">La primera fila debe tener los encabezados. Columnas reconocidas:<br>
      <code>sku; nombre; precio; stock; oem; marca; modelo; anio; descripcion; observaciones</code></p>

  App.vistas.clientes = async function (vista) {
    const f = { q: App.params().get('q') || '' };
    vista.innerHTML = `
      <div class="cabecera-vista"><div><h1>Clientes</h1><p class="muted" id="totalCli"></p></div>

      <div id="resultados"></div>`;
    const cargar = async () => {
      const r = await App.get(`/api/admin/clientes?q=${encodeURIComponent(f.q)}`);
      $('#totalCli').textContent = `${r.total} cliente(s) registrados`;
      $('#resultados').innerHTML = !r.filas.length
        ? App.vacio(f.q ? 'No hay clientes que coincidan.' : 'Aún no hay clientes. Se registran al crear cotizaciones o desde «Nuevo cliente».')
        : `<div class="tabla-envoltura solo-escritorio"><table class="tabla"><thead><tr><th>Nombre / Razón social</th><th>RUT</th><th>Teléfono</th><th>Correo</th><th class="num">Cotizaciones</th></tr></thead>
          <tbody>${r.filas
            .map(
              (c) => `<tr data-ir="#/clientes/${c.id}"><td><strong>${esc(c.nombre)}</strong></td><td>${c.rut ? esc(JJV.formatearRut(c.rut)) : '—'}</td>
            <td>${esc(c.whatsapp || c.telefono || '')}</td><td>${esc(c.email || '')}</td><td class="num">${c.n_cotizaciones}</td></tr>`
            )
            .join('')}</tbody></table></div>
          <div class="lista solo-movil">${r.filas
            .map(
              (c) => `<a class="fila-tarjeta" href="#/clientes/${c.id}"><div class="linea"><span class="titulo">${esc(c.nombre)}</span><span class="muted small">${c.n_cotizaciones} cot.</span></div>

            )
            .join('')}</div>`;
    };
    const recargar = App.debounce(() => cargar().catch(App.error), 300);

  function modalCliente(c, alGuardar) {
    const v = c || {};
    App.modal(
      `${App.cabeceraModal(c ? 'Editar cliente' : 'Nuevo cliente')}
      <form id="formCli" class="rejilla rejilla-2" novalidate>
        <div class="campo"><label>RUT *</label><input name="rut" value="${v.rut ? esc(JJV.formatearRut(v.rut)) : ''}" placeholder="12.345.678-9"><span class="error-campo" id="rutErr"></span></div>

        <div class="campo"><label>Teléfono *</label><input name="telefono" type="tel" inputmode="tel" value="${esc(v.telefono || '')}"></div>
        <div class="campo"><label>WhatsApp</label><input name="whatsapp" type="tel" inputmode="tel" value="${esc(v.whatsapp || '')}" placeholder="Si es distinto al teléfono"></div>
        <div class="campo"><label>Correo electrónico</label><input name="email" type="email" inputmode="email" value="${esc(v.email || '')}"></div>
        <div class="campo"><label>Dirección</label><input name="direccion" value="${esc(v.direccion || '')}"></div>

      </form>

        <button class="btn" data-cerrar>Cancelar</button><button class="btn btn-primario" data-ok>${icono('guardar')} Guardar</button></div>`,
      {
        alMontar: (el, cerrar) => {
          const rut = $('[name="rut"]', el);
          App.prepararRut(rut, {
            alValidar: async (r) => {
              $('#rutErr', el).textContent = r === false ? 'RUT no válido' : '';
              if (r && !c) {
                try {
                  const ex = await App.get(`/api/admin/clientes/rut/${encodeURIComponent(r)}`);
                  $('#rutErr', el).innerHTML = `Ya existe: <a href="#/clientes/${ex.id}" data-cerrar>${esc(ex.nombre)}</a>`;
                } catch {}
              }
            },
          });
          $('[data-ok]', el).addEventListener('click', async () => {
            const datos = leerFormulario($('#formCli', el));
            if (!JJV.validarRut(datos.rut)) return App.toast('Ingrese un RUT válido.', 'error');
            try {
              const r = c ? await App.put(`/api/admin/clientes/${c.id}`, datos) : await App.post('/api/admin/clientes', datos);
              cerrar();
              App.toast('Cliente guardado', 'ok');
              alGuardar(r.id);
            } catch (e) {
              App.error(e);
            }
          });
          const borrar = $('[data-borrar]', el);
          if (borrar)
            borrar.addEventListener('click', async () => {
              cerrar();
              if (!(await App.confirmar('¿Eliminar este cliente? Sus cotizaciones se conservan con los datos que tenían.', { boton: 'Eliminar', peligro: true }))) return;
              try {
                await App.del(`/api/admin/clientes/${c.id}`);
                App.toast('Cliente eliminado', 'ok');
                location.hash = '#/clientes';
              } catch (e) {
                App.error(e);
              }
            });
        },
      }
    );
  }

          fd.append('archivo', archivo);
          const r = await App.api('POST', '/api/admin/importar/respaldo', fd, { formulario: true });
          App.toast(`Respaldo cargado: ${r.cotizaciones} cotizaciones, ${r.clientes} clientes, ${r.productos} repuestos y ${r.solicitudes} solicitudes.`, 'ok');
          App.repintarDiseno();
          App.ir('#/configuracion');
        } else if (e.target.closest('[data-agregar-usuario]')) {
          await App.post('/api/admin/usuarios', leerFormulario($('#formUsuario', vista)));
          App.toast('Usuario agregado', 'ok');
          App.ir('#/configuracion');
        } else if (e.target.closest('[data-borrar-usuario]')) {
          if (!(await App.confirmar('¿Eliminar este usuario?', { boton: 'Eliminar', peligro: true }))) return;
          await App.del(`/api/admin/usuarios/${e.target.closest('[data-borrar-usuario]').dataset.borrarUsuario}`);
          App.ir('#/configuracion');
        } else if (e.target.closest('[data-cambiar-pass]')) {
          const r = await App.put('/api/admin/usuarios/password', leerFormulario($('#formPass', vista)));
          App.toast(r.mensaje, 'ok');
          setTimeout(() => (location.href = '/login'), 1500);
        }
      } catch (err) {
        App.error(err);
      }
    });
  };
})();
